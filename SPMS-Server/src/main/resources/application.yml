# file: noinspection SpellCheckingInspection
logging:
  config: 'classpath:logback-spring.xml'
  level:
    org.springframework.beans: debug
    org.springframework.context: debug
server:
  port: 8080
spring:
  profiles:
    active: local
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kubo?useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: root
    password: root
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        column_ordering_strategy: legacy
  mail:
    properties:
      mail:
        smtp:
          # 开启SMTP身份验证
          auth: true
          ssl:
            # 启用SSL加密传输
            enable: true
          # 使用SSL Socket Factory
          socketFactory-class: javax.net.ssl.SSLSocketFactory
          socketFactory-fallback: false
          starttls:
            # 不需要StartTLS
            enable: false
  web:
    resources:
      add-mappings: false
  mvc:
    view:
      suffix: .html
      prefix: /
airpower:
  websocket:
    support: redis
  api:
    access-token-secret: '1234567890'
    request-log: true
    response-log: true

# SpringDoc OpenAPI 3 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    groups:
      enabled: false
  swagger-ui:
    enabled: true
    path: /doc.html
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
    filter: true
    deep-linking: true
    display-request-duration: true
    doc-expansion: none
  packages-to-scan: cn.hamm.spms
  paths-to-match:
    - /api/**
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  model-converters:
    pageable-converter:
      enabled: true

# 数据权限（行级过滤 + 列级脱敏）灰度开关
# 见 docs/数据权限目标态落地施工图.md 决策 D2 / D3
#  - off    : 完全不参与（回滚位，与改造前行为一致）
#  - shadow : 计算并记录差异，不改变查询结果（观察期）
#  - enforce: 真正注入过滤条件，绑定失败按空结果集处理（fail-closed）
# 目标态是 shadow 全量 -> enforce 逐资源白名单放开；
# 注意 enforce 的前提是迁移脚本已执行且实体已映射 tenant_id/creator_id，
# 否则这里会把"列不存在"直接变成查不到数据 —— 这正是用来暴露空转的机制。
kubo:
  data-permission:
    mode: off
    tenant-required: false
    default-tenant-id: 1
    deny-unregistered: false
    shadow-diff-log: true
    audit-plaintext-access: true
    enforce-resources: []
    # 影子双跑：同一次查询多打一次 COUNT，比较"加条件/不加条件"的行数差
    # （差异写 data_permission_diff_log，见 docs/database/migration/20260907_*.sql）
    shadow:
      sample-rate: 0.02
      persist: true
      max-detail-rows: 200
