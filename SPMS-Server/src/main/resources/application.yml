# file: noinspection SpellCheckingInspection
logging:
  config: 'classpath:logback-spring.xml'
  level:
    org.springframework.beans: debug
    org.springframework.context: debug
server:
  port: 8080
spring:
  profiles:
    active: local
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kubo?useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: root
    password: root
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  # 数据库迁移（Flyway）：schema 的唯一入口。
  #  - baseline-on-migrate: 存量库（开发/生产）已有完整表结构，首次接入把当前状态
  #    记为 baseline 1、**不执行 V1 基线**，只往后应用 V2+；全新库从 V1 开始跑。
  #  - validate-on-migrate: 校验已应用迁移的校验和，防止有人改历史脚本造成
  #    "新库与旧库结构不一致"这种最难查的问题。
  #  - 与 ddl-auto: validate 并存是刻意的：JPA 校验是过渡期第二道网，
  #    去 JPA（写路径换 MyBatis）之后这一行会一起删掉。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: 存量库接入基线
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        column_ordering_strategy: legacy
  mail:
    properties:
      mail:
        smtp:
          # 开启SMTP身份验证
          auth: true
          ssl:
            # 启用SSL加密传输
            enable: true
          # 使用SSL Socket Factory
          socketFactory-class: javax.net.ssl.SSLSocketFactory
          socketFactory-fallback: false
          starttls:
            # 不需要StartTLS
            enable: false
  web:
    resources:
      add-mappings: false
  mvc:
    # 勿在这里再加 spring.mvc.pathmatch.matching-strategy：Boot 3.4 虽然仍解析该 PROPERTY，
    # 但 Spring 6.2 的资源注册表一律按 PathPatternParser 解析模式，ant_path_matcher 救不了
    # （springdoc 旧版 /swagger-ui/**/*swagger-initializer.js 就是这样崩的，已靠升级 springdoc 解决）。
    view:
      suffix: .html
      prefix: /
# 框架配置（2026-09-18 后端 airpower 退场：原 airpower.api.* → spms.api.*）
# 说明：这一节由本仓自持的 cn.hamm.spms.framework.api.config.ApiConfig 绑定，
#      与 spms.cookie（原 airpower.cookie）同一种改名方式 —— 前缀改成自己的名字，
#      因为从此这套配置的语义、默认值、兼容性都由本仓负责。
spms:
  api:
    # S2：JWT 签名密钥改为环境变量注入。开发环境用弱默认值无妨，生产必须覆盖为强随机值
    #（部署时设置环境变量 SPMS_API_ACCESS_TOKEN_SECRET）。密钥一旦上线变更会使存量令牌失效。
    # 改名影响：旧的 AIRPOWER_API_ACCESS_TOKEN_SECRET 不再被读取（不是"兼容期双读"，是彻底换名）——
    # 部署环境必须同步改名，否则 AccessTokenSecretGuard 会拒绝启动并打印新变量名（fail-fast，不会静默用弱默认值）。
    access-token-secret: '${SPMS_API_ACCESS_TOKEN_SECRET:1234567890}'
    # P3：request-log/response-log 是「请求/响应包体日志」开关（框架默认 true），
    # 开启会把完整 body 打印到日志（登录密码、token、客户 PII、查询结果）。这里仅用于本地/开发
    # 排障；生产由 application-production.yml 显式覆盖为 false，禁止明文打印包体。
    request-log: true
    response-log: true

# SpringDoc OpenAPI 3 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    groups:
      enabled: false
  swagger-ui:
    # 内置 UI 不可用，且 pom 已改用 springdoc-openapi-starter-webmvc-api（不含 UI 模块）。
    # 勿换回 -ui starter：它的 SwaggerWebMvcConfigurer 无视本开关，始终注册
    # /swagger-ui/**/*index.html 这类「** 后挂片段」模式，Spring 6.2 的 PathPatternParser
    # 判为非法 → resourceHandlerMapping 创建失败、容器起不来（2.8.15 / 2.9.1 实测崩溃）。
    # OpenAPI JSON（/v3/api-docs）不受影响，消费方式见 docs/API_DOCS_GUIDE.md。
    enabled: false
  packages-to-scan: cn.hamm.spms
  # 真实路由是 /<模块>/<动作>（@Api("user") → /user/login），`/api` 前缀只存在于 Vite
  # dev 代理的 rewrite 里。曾经的 `/api/**` 过滤器把整份 schema 筛成了空 paths。
  paths-to-match:
    - /**
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  model-converters:
    pageable-converter:
      enabled: true

# MyBatis（读侧专用，开关在 kubo.data-permission.mapper-read）
# mapper-locations 与 MyBatis-Plus 的默认值相同，这里刻意写出来：默认值是看不见的约定，
# 而"XML 放在哪"决定新增资源的语句会不会被加载 —— 漏了不会在启动时报错，
# 只会在第一次调用时抛 Invalid bound statement（那通常已经是线上）。
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

# 数据权限（行级过滤 + 列级脱敏）灰度开关
# 见 docs/数据权限目标态落地施工图.md 决策 D2 / D3
#  - off    : 完全不参与（回滚位，与改造前行为一致）
#  - shadow : 计算并记录差异，不改变查询结果（观察期）
#  - enforce: 真正注入过滤条件，绑定失败按空结果集处理（fail-closed）
# 目标态是 shadow 全量 -> enforce 逐资源白名单放开；
# 注意 enforce 的前提是迁移脚本已执行且实体已映射 tenant_id/creator_id，
# 否则这里会把"列不存在"直接变成查不到数据 —— 这正是用来暴露空转的机制。
kubo:
  security:
    # C-1（阶段D）：AccessTokenSecretGuard 现在对所有 profile 无条件校验密钥强度，
    # 不再依赖 SPRING_PROFILES_ACTIVE 是否被正确注入。本开关仅限本地开发；
    # 部署环境必须删除本行或置 false（application-production.yml 已显式置 false），
    # 否则默认弱密钥启动即 fail-fast。
    allow-weak-default-secret: true
    # F-1（阶段F）：仅当直连对端（getRemoteAddr）命中本白名单（逗号分隔 CIDR 或精确 IP）
    # 时才采信 X-Forwarded-For / X-Real-IP。nginx 反代部署必须配置代理自身地址/网段
    # （如 127.0.0.1/32 或 10.0.0.0/8），否则攻击者可伪造该头绕过登录失败锁定与公开端点限流。
    trusted-proxies: ""
  data-permission:
    mode: off
    tenant-required: false
    default-tenant-id: 1
    deny-unregistered: false
    shadow-diff-log: true
    audit-plaintext-access: true
    # mode=shadow 且名单为空 / mode=off 时不触发 readiness 查询；一旦名单或全局档位实际进入 enforce，
    # ApplicationReadyEvent 会复用 /dataResource/enforce-readiness，任何阻塞项未通过都拒绝启动，不设 bypass 开关。
    enforce-resources: []
    # 读侧 Mapper（P2 · A2「读走 Mapper，写留 JPA」）：默认 false = 容器里一个 Mapper Bean 都没有，
    # 而不是"注册了但不用"，所以"关掉 = 与换轨前逐字节相同"这句话是可验的（MybatisJpaCoexistenceTest 钉住）。
    # 它同时是 ORM 对账的唯一开关（§19.36）：RowParityRegistry 这个 Bean 就挂在本类上，
    # 关着 ⇒ 探针表不存在 ⇒ ShadowDiffService 连第三个 COUNT 都不发，enforce-readiness 的 ORM_PARITY
    # 那一档对每个资源都报"不适用"（不是"通过"）。刻意不加第二个开关：两个旋钮管同一件事，
    # 迟早出现"探针没注册但 Mapper 已注册"这种半开状态，那种比全关难查。
    # 打开之后仍然没有生产读端点（列表/详情/统计/导出还在 JPA）：现在多出来的只有对账证据。
    mapper-read:
      enabled: false
    # 工厂维度落地开关（D13-B 起默认开）：user_factory 表 + 真实解析 factoryIds 都已接线，
    # 启动期 FactoryDimensionReadiness 还会核对元模型，缺链路会直接启动失败而不是假安全
    factory-dimension-enabled: true
    # 影子双跑：同一次查询多打一次 COUNT，比较"加条件/不加条件"的行数差
    # （差异写 data_permission_diff_log，见 docs/database/migration/20260907_*.sql）
    shadow:
      sample-rate: 0.02
      persist: true
      max-detail-rows: 200
      # 证据留存：默认关闭且可审计；完成数据库备份/归档后，再显式打开滚动清理
      retention-cleanup-enabled: false
      retention-days: 30
      retention-cleanup-cron: '0 15 3 * * *'
    # 写侧行级保护：改/删既存行之前，用读侧同一份条件判"这一行在不在你的数据范围内"
    # 默认 false 的理由：读侧条件绑不上只是查不到数据，写侧条件绑不上是"保存被拒"，直接打断业务。
    # 灰度顺序固定：维度绑定风险面板清零 → 打开本开关看 shadow 指标 → 再把资源加进 enforce-resources
    row-write:
      enabled: false
    # 部门层级闭包：打开后 DEPARTMENT 维度的策略主体自动展开到全部后代部门
    # 默认 false 的理由：展开是**放宽**可见范围（配在父部门的策略会盖住整棵子树），
    # 而现网既有策略都是按"只影响直属部门"配的。放开前先影子比对"多放行多少行"
    hierarchy:
      department-enabled: false
      # 工厂层级展开：FACTORY 策略的主体（工厂=仓库/工厂树顶层节点）是否向下闭包到整棵子树。
      # 与 department-enabled 同理，默认关（展开是放宽可见范围）；且仅在 factory-dimension-enabled
      # 落地后才有意义。仓库/工厂树快照复用下方 ttl-seconds / max-depth。
      factory-enabled: false
      # 部门/工厂树快照有效期（秒）：进程内缓存，树增删改会显式失效；Redis 不可用时靠它自愈
      ttl-seconds: 300
      # 展开层数上限：脏数据成环时的兜底，超出即停止并打 WARN（少看数据可接受，把请求打挂不行）
      max-depth: 32
    # 权限变更 Outbox Dispatcher：写侧落库（PermissionChangeOutboxRecorder）与派发解耦。
    # 默认 false = 不启动轮询（本地/测试环境），事件仍持久化但不会自动重投；真实环境核对
    # permission_change_outbox 表 + Redis 后打开。轮询间隔 poll-ms 默认 5s。
    outbox:
      enabled: false
      poll-ms: 5000
