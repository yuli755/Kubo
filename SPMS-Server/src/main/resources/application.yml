# file: noinspection SpellCheckingInspection
logging:
  config: 'classpath:logback-spring.xml'
  level:
    org.springframework.beans: debug
    org.springframework.context: debug
server:
  port: 8080
spring:
  profiles:
    active: local
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kubo?useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: root
    password: root
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        column_ordering_strategy: legacy
  mail:
    properties:
      mail:
        smtp:
          # 开启SMTP身份验证
          auth: true
          ssl:
            # 启用SSL加密传输
            enable: true
          # 使用SSL Socket Factory
          socketFactory-class: javax.net.ssl.SSLSocketFactory
          socketFactory-fallback: false
          starttls:
            # 不需要StartTLS
            enable: false
  web:
    resources:
      add-mappings: false
  mvc:
    view:
      suffix: .html
      prefix: /
airpower:
  websocket:
    support: redis
  api:
    access-token-secret: '1234567890'
    request-log: true
    response-log: true

# SpringDoc OpenAPI 3 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    groups:
      enabled: true
  swagger-ui:
    enabled: true
    path: /doc.html
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
    filter: true
    deep-linking: true
    display-request-duration: true
    doc-expansion: none
  packages-to-scan: cn.hamm.spms
  paths-to-match:
    - /api/**
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  model-converters:
    pageable-converter:
      enabled: true
