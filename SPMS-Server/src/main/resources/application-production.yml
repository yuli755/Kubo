# 可靠性加固（P1）：优雅停机。k8s 滚动更新 / 负载均衡摘流时，让在途请求处理完再下线，
# 避免连接被粗暴切断（表现为 5xx / 半提交事务）。
server:
  shutdown: graceful

# 可观测性加固（P1）：生产关闭 Spring 内部 debug（application.yml 里 beans/context 是 debug，
# 会打进生产的噪音 + 性能开销 + 内部实现信息）。
logging:
  level:
    org.springframework.beans: info
    org.springframework.context: info

# 可靠性加固（P1）：健康检查显式声明。默认只暴露 health，这里显式收紧为 health,info，
# 并启用 readiness/liveness 探针（k8s 探针的刚需），敏感端点（env/beans/configprops）保持默认关闭。
# 可观测性（§7.2）：追加 prometheus，暴露 /actuator/prometheus 供 Prometheus 抓取 JVM/HTTP/HikariCP
# 指标（依赖 pom 的 micrometer-registry-prometheus；不引入该依赖时此端点不存在，不会报错）。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

spring:
  lifecycle:
    # 优雅停机每阶段最长等待（配合 server.shutdown: graceful）
    timeout-per-shutdown-phase: 30s
  jpa:
    show-sql: false
    hibernate:
      # 生产必须 validate：schema 由 docs/database/migration/*.sql 受控变更（决策 D2）。
      # 历史这里是 update —— 与注释自相矛盾，且会让"实体没有映射列"这种问题
      # 被 Hibernate 静默改表掩盖掉（tenant_id 加列后尤其危险）。
      ddl-auto: validate
  datasource:
    # S3：生产凭据外置为环境变量，不再把明文 kubo/kubo 提交进仓库。
    # useSSL=false 仅适用于可信内网/k8s 集群内部通信；若 DB 走公网必须改 true 并配 CA。
    url: 'jdbc:mysql://kubo-mysql:3306/kubo?allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&useSSL=false'
    username: '${DB_USERNAME:kubo}'
    password: '${DB_PASSWORD:kubo}'
  data:
    redis:
      host: kubo-redis
      port: 6379
      database: 5
spms:
  # 生产禁止日志短信提供商；缺少真实通道配置时应用必须拒绝启动。
  sms:
    provider: '${SPMS_SMS_PROVIDER:}'
  api:
    # P3：生产关闭请求/响应包体日志。airpower 的 request-log/response-log 会把完整请求/响应
    # body 打印到日志（登录密码、token、客户 PII、查询结果），是 PII 泄露面 + 无谓日志 I/O。
    # 排障改用 traceId（airpower 默认 bodyTraceId: true，响应体带 traceId 可关联）。
    request-log: false
    response-log: false
  notification:
    # 企业群机器人告警与通知 Webhook（生产环境由环境变量注入）
    webhook:
      url: '${SPMS_NOTIFICATION_WEBHOOK_URL:}'
      platform: '${SPMS_NOTIFICATION_WEBHOOK_PLATFORM:generic}'

app:
  upload-platform: local
  login-url: 'https://kubo.hamm.cn/login'
  export:
    # 异步导出状态/结果仅保留有限时间，避免 Redis 与导出索引永久增长。
    task-ttl-seconds: '${SPMS_EXPORT_TASK_TTL_SECONDS:3600}'
    file-retention-days: '${SPMS_EXPORT_FILE_RETENTION_DAYS:1}'
    file-retention-cleanup-cron: '${SPMS_EXPORT_FILE_RETENTION_CLEANUP_CRON:0 30 3 * * *}'

# SpringDoc OpenAPI 3 生产环境配置
springdoc:
  api-docs:
    # S3：生产不暴露 OpenAPI schema（接口清单会泄露端点/字段结构，是攻击面测绘的来源）
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false # 生产环境建议关闭 UI
  show-actuator: false

# 生产以白名单逐步推进数据权限放量：
#   第一批次 wms.inventory（仓储库存）
#   第二批次 channel.purchase / channel.sale（购销核心单据）
#   第三批次 channel.customer / channel.supplier / asset.material（客户、供应商与物料档案）
kubo:
  security:
    # C-1（阶段D）：生产绝不放行弱默认 JWT 密钥；未注入
    # AIRPOWER_API_ACCESS_TOKEN_SECRET 时 AccessTokenSecretGuard 直接拒绝启动。
    allow-weak-default-secret: false
    # R45：防爆破守卫阈值。代码默认（SecurityGuardProperties）= 参数化前的常量，
    # 不配置 = 行为逐位不变。这里只暴露「按部署拓扑才需要调」的四键（宁窄勿宽：
    # 每多一个环境变量就多一个部署误操作面）；占位符默认值与代码默认一致，
    # 部署侧不注入任何环境变量也照常运行。
    brute-force:
      login:
        lock-seconds: '${LOGIN_LOCK_SECONDS:900}'
        ip-max-fail-attempts: '${LOGIN_IP_MAX_FAIL_ATTEMPTS:50}'
      reset:
        lock-seconds: '${RESET_LOCK_SECONDS:900}'
        ip-max-fail-attempts: '${RESET_IP_MAX_FAIL_ATTEMPTS:50}'
  data-permission:
    # 档位由 .env 的 DATA_PERMISSION_MODE 一键控制（占位符显式绑定，部署零改码）：
    #   shadow  —— 默认档：全量影子比对打点，收集 SHADOW_EVIDENCE 放量证据；
    #   enforce —— 放量完成档：6 资源白名单进入强管控（启动期 readiness 闸门会用
    #              真实影子证据复核，证据不足直接拒绝启动，红着开闸是不可能的）；
    #   off     —— 紧急回滚档：一键关闭全部拦截，恢复旧行为。
    mode: "${DATA_PERMISSION_MODE:shadow}"
    # 当前生产白名单包含实际 ENFORCE 资源，租户归属缺失必须默认拒绝；回滚只能显式改为 false 并重新过发布门禁。
    tenant-required: "${DATA_PERMISSION_TENANT_REQUIRED:true}"
    shadow-diff-log: true
    enforce-resources:
      - wms.inventory
      - channel.purchase
      - channel.sale
      - channel.customer
      - channel.supplier
      - asset.material
    outbox:
      enabled: true
      poll-ms: 5000
