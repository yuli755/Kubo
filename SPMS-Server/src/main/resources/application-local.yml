spring:
  jpa:
    show-sql: true
    hibernate:
      # 生产模式请严格使用 validate
      ddl-auto: update
  datasource:
    url: 'jdbc:mysql://localhost:3306/kubo?allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&useSSL=false'
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: '' # Redis 无密码时留空

app:
  is-dev-mode: true
