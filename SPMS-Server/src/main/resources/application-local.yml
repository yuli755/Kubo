# SpringDoc OpenAPI 3 开发环境配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /doc.html
    try-it-out-enabled: true
    filter: true
  show-actuator: true
