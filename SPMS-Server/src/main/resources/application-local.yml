server:
  # 与 vite.config.mts 的 /api 代理、README/STARTUP/LOGIN 文档保持一致：后端统一 8080。
  # （历史此处曾写 8081，属某台开发机的遗留值，会导致 `pnpm dev` 代理到 8080 时连不上后端。）
  port: 8080
spring:
  jpa:
    show-sql: true
    hibernate:
      # 生产模式请严格使用 validate
      ddl-auto: update
  datasource:
    url: 'jdbc:mysql://localhost:3306/kubo?allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8&useSSL=false'
    username: root
    password: root
  data:
    redis:
      host: localhost
      # 与 STARTUP.md 的 `docker run -d --name kubo-redis -p 6379:6379 redis:alpine` 对齐：
      # 本地 Redis 默认 6379、无密码。
      port: 6379
      database: 0

app:
  is-dev-mode: true
#  mail:
#    host: "smtp.exmail.qq.com"
#    port: 465
#    username: "your_email@your_domain.com"
#    password: "your_email_password"

# SpringDoc OpenAPI 3 开发环境配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /doc.html
    try-it-out-enabled: true
    filter: true
  show-actuator: true
