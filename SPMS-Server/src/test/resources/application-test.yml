# H2 集成测试配置
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=RUNSCRIPT FROM 'classpath:schema-test.sql'
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # 禁用缓存，避免 airpower RedisConfigurer bean 冲突
  cache:
    type: none

# 禁用 Redis / MQTT（测试时使用内存 Map 代替）
airpower:
  redis:
    enabled: false
    host: localhost
    port: 6379
  mqtt:
    enabled: false
    host: localhost
    port: 1883

# 关闭开发模式，防止 DevDataInitRunner 运行
app:
  isDevMode: false