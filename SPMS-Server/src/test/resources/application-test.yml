# H2 集成测试配置
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=RUNSCRIPT FROM 'classpath:schema-test.sql'
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # 禁用缓存，避免 airpower RedisConfigurer bean 冲突
  cache:
    type: none
  # 测试库是 H2（MODE=MySQL）+ schema-test.sql 内联建表；db/migration 下是 MySQL 方言
  # （存储过程、information_schema 探测），在 H2 上跑不了也不该跑 —— 关掉。
  # ⚠️ 生产 schema 变更**不允许**走 schema-test.sql：它只是测试子集，
  #    真正的事实源是 db/migration（见 docs/database/Flyway-S0·基线与收编.md）。
  flyway:
    enabled: false

# 禁用 Redis / MQTT（测试时使用内存 Map 代替）
airpower:
  redis:
    enabled: false
    host: localhost
    port: 6379
  mqtt:
    enabled: false
    host: localhost
    port: 1883

# 关闭开发模式，防止 DevDataInitRunner 运行
app:
  isDevMode: false

# 工厂维度在 H2 测试环境不落地：DevDataInitRunner 被上面关掉后，data_resource 没有
# 工厂维度的种子/回填，FactoryDimensionReadiness 的启动闸（factory-dimension-enabled=true
# 时核对「有资源具备工厂归属列」）会把 @SpringBootTest 的上下文加载打挂。测试环境按
# 真实状态声明开关关掉，与生产（application.yml 默认 true + 迁移回填 + DevDataInitRunner 种子）分开。
kubo:
  data-permission:
    factory-dimension-enabled: false

# 注：spring.flyway.enabled=false 已上移合并进文件开头唯一的 spring: 块。
# 此前本处又写了一个顶层 spring:，YAML 不允许重复键，SnakeYAML 直接抛
# DuplicateKeyException，导致所有 @SpringBootTest 上下文加载失败（约 100 个测试报错）。
