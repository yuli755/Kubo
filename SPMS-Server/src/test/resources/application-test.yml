# 测试库是 H2（MODE=MySQL）+ schema-test.sql 内联建表（只是**用到的子集**）。
# 生产/开发库的结构与数据在 infra/init-sql/{init,init_data}.sql 两个文件里（MySQL 8 方言），
# 在 H2 上跑不了也不该跑 —— 后端测试不依赖 SQL 脚本，只依赖实体与 schema-test.sql 子集。
# H2 集成测试配置
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=RUNSCRIPT FROM 'classpath:schema-test.sql'
    username: sa
    password:
  # 测试不吃真实缓存：`type: none` 让 Boot 走 NoOp 缓存管理器。
  # （本仓 `framework/redis/RedisConfigurer` 仍会声明一个 `CacheManager`，但它只在真的调
  #  `@Cacheable` 时才连 Redis；现有用例不依赖缓存命中，缓存相关断言都走桩。）
  cache:
    type: none

# 这里原本还有一段 `airpower.redis.*` / `airpower.mqtt.*`，2026-09-18 删除：
# airpower 整体退场后**没有任何代码读 `airpower.*`**，它是纯死配置（MQTT 也在更早的
# WebSocket/MQTT 残栈清理里移除）。删它的同时把 `pnpm airpower:backend -- --check`
# 的扫描面从 `src/main/resources` 扩到了 `src/test/resources` —— 否则这几行会一直
# 藏在测试资源里，而门禁照样打印「yml 0 配置键」（空转的闸门）。

# 关闭开发模式，防止 DevDataInitRunner 运行
app:
  isDevMode: false

# 工厂维度在 H2 测试环境不落地：DevDataInitRunner 被上面关掉后，data_resource 没有
# 工厂维度的种子/回填，FactoryDimensionReadiness 的启动闸（factory-dimension-enabled=true
# 时核对「有资源具备工厂归属列」）会把 @SpringBootTest 的上下文加载打挂。测试环境按
# 真实状态声明开关关掉，与生产（application.yml 默认 true + 迁移回填 + DevDataInitRunner 种子）分开。
kubo:
  data-permission:
    factory-dimension-enabled: false

# 测试库是 H2（MODE=MySQL）+ schema-test.sql 内联建表（只是**用到的子集**）。
# 生产/开发库的结构与数据在 infra/init-sql/{init,init_data}.sql 两个文件里（MySQL 8 方言），
# 在 H2 上跑不了也不该跑 —— 后端测试不依赖 SQL 脚本，只依赖实体与 schema-test.sql 子集。
spring:
  # 无迁移框架：结构与数据脚本不进测试上下文（见文件头说明）
  sql:
    init:
      mode: never
