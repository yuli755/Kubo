# H2 集成测试配置
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=RUNSCRIPT FROM 'classpath:schema-test.sql'
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # 禁用缓存，避免 airpower RedisConfigurer bean 冲突
  cache:
    type: none

# 禁用 Redis / MQTT（测试时使用内存 Map 代替）
airpower:
  redis:
    enabled: false
    host: localhost
    port: 6379
  mqtt:
    enabled: false
    host: localhost
    port: 1883

# 关闭开发模式，防止 DevDataInitRunner 运行
app:
  isDevMode: false

# 工厂维度在 H2 测试环境不落地：DevDataInitRunner 被上面关掉后，data_resource 没有
# 工厂维度的种子/回填，FactoryDimensionReadiness 的启动闸（factory-dimension-enabled=true
# 时核对「有资源具备工厂归属列」）会把 @SpringBootTest 的上下文加载打挂。测试环境按
# 真实状态声明开关关掉，与生产（application.yml 默认 true + 迁移回填 + DevDataInitRunner 种子）分开。
kubo:
  data-permission:
    factory-dimension-enabled: false
