<!DOCTYPE html>
<html lang="zh-cn">

<head>
  <title>Kubo · 智能生产管理系统</title>
  <meta charset="utf-8">
  <meta content="" name="keywords">
  <meta content="" name="description">
  <meta content="yes" name="mobile-web-app-capable">
  <meta content="yes" name="apple-mobile-web-app-capable">
  <meta content="#ffffff" name="theme-color">
  <script>
    // V2 首屏防闪烁：在 JS bundle 与样式加载前，按持久化偏好同步 html.dark 与 theme-color。
    // 逻辑与 src/stores/theme.ts 的 resolveDark 保持一致（此处不依赖任何运行时库）。
    ;(function () {
      try {
        var pref = localStorage.getItem('kubo:theme') || 'system'
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('dark')
        }
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) {
          meta.content = dark ? '#141414' : '#ffffff'
        }
      }
      catch (e) { /* localStorage 不可用时静默降级为浅色 */ }
    })()
  </script>
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <link href="/favicon.ico" rel="shortcut icon">
  <meta content="telephone=no" name="format-detection">
  <!-- 允许双指缩放：user-scalable=no + maximum-scale=1 会把页面锁死在 1 倍，
       小屏上内容偏小时用户无法放大查看（无障碍硬伤）；viewport-fit=cover 配合
       刘海屏安全区。见测试报告 §9。 -->
  <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport">
  <style>
    /* V1：首屏内联骨架屏也走变量，避免硬编码浅灰在深色下刺眼。
       （EP 暗色 css-vars 此时尚未加载，故在此内联声明暗色映射） */
    :root {
      --loader-bg: #f5f7fa;
      --loader-text: #909399;
      --loader-track: #e4e7ed;
    }

    html.dark {
      --loader-bg: #141414;
      --loader-text: #8c8c8c;
      --loader-track: #333333;
    }

    /* #app 内联骨架屏：在 JS bundle 解析前为用户提供即时视觉反馈 */
    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--loader-bg);
      z-index: 9999;
    }

    #app-loader .loader-logo {
      width: 56px;
      height: 56px;
      margin-bottom: 24px;
      border-radius: 14px;
      background: linear-gradient(120deg, #409eff, #66b1ff);
      box-shadow: 0 6px 18px rgba(64, 158, 255, 0.35);
      animation: loader-pulse 1.2s ease-in-out infinite;
    }

    #app-loader .loader-bar {
      width: 180px;
      height: 6px;
      border-radius: 3px;
      background: var(--loader-track);
      overflow: hidden;
    }

    #app-loader .loader-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #409eff, #66b1ff);
      animation: loader-slide 1.2s ease-in-out infinite;
    }

    #app-loader .loader-text {
      margin-top: 18px;
      font-size: 13px;
      color: var(--loader-text);
      letter-spacing: 1px;
    }

    @keyframes loader-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.92); opacity: 0.8; }
    }

    @keyframes loader-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>

<body>
<div id="app">
  <!-- 骨架屏：Vue 挂载后会被 #app 内容替换 -->
  <div id="app-loader">
    <div class="loader-logo"></div>
    <div class="loader-bar"></div>
    <div class="loader-text">Kubo 平台加载中…</div>
  </div>
</div>
<script src="/src/main.ts" type="module"></script>
</body>

</html>
