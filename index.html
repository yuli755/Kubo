<!DOCTYPE html>
<html lang="zh-cn">

<head>
  <title>Kubo · 智能生产管理系统</title>
  <meta charset="utf-8">
  <meta content="" name="keywords">
  <meta content="" name="description">
  <meta content="yes" name="mobile-web-app-capable">
  <meta content="yes" name="apple-mobile-web-app-capable">
  <meta content="#000" name="theme-color">
  <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
  <link href="/favicon.ico" rel="shortcut icon">
  <meta content="telephone=no" name="format-detection">
  <meta content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
  <style>
    /* #app 内联骨架屏：在 JS bundle 解析前为用户提供即时视觉反馈 */
    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
      z-index: 9999;
    }

    #app-loader .loader-logo {
      width: 56px;
      height: 56px;
      margin-bottom: 24px;
      border-radius: 14px;
      background: linear-gradient(120deg, #409eff, #66b1ff);
      box-shadow: 0 6px 18px rgba(64, 158, 255, 0.35);
      animation: loader-pulse 1.2s ease-in-out infinite;
    }

    #app-loader .loader-bar {
      width: 180px;
      height: 6px;
      border-radius: 3px;
      background: #e4e7ed;
      overflow: hidden;
    }

    #app-loader .loader-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #409eff, #66b1ff);
      animation: loader-slide 1.2s ease-in-out infinite;
    }

    #app-loader .loader-text {
      margin-top: 18px;
      font-size: 13px;
      color: #909399;
      letter-spacing: 1px;
    }

    @keyframes loader-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.92); opacity: 0.8; }
    }

    @keyframes loader-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>
</head>

<body>
<div id="app">
  <!-- 骨架屏：Vue 挂载后会被 #app 内容替换 -->
  <div id="app-loader">
    <div class="loader-logo"></div>
    <div class="loader-bar"></div>
    <div class="loader-text">Kubo 平台加载中…</div>
  </div>
</div>
<script src="/src/main.ts" type="module"></script>
</body>

</html>
