# =============================================================================
# Kubo 生产级闭环编排（从代码到生产交付标准）
# =============================================================================
# 包含组件：
#   1. kubo-mysql  : MySQL 8.0 核心存储（持久化卷 + 自动化初始建表）
#   2. kubo-redis  : Redis 7.2 高性能缓存与分布式锁（AOF 持久化 + 密码鉴权）
#   3. kubo-server : Spring Boot 3.4.4 / Java 17 后端（非 root + 容器感知堆内存）
#   4. kubo-web    : Vue 3 + Nginx 反向代理（极小镜像 ~25MB，反代 API）
#   5. prometheus  : 生产指标抓取（仅抓编排内真实存在的服务）
#   6. alertmanager: 告警通知（启动时用 .env 的 KUBO_ALERT_WEBHOOK_URL 渲染模板，
#                    零手动改配置；真实触达验收用 pnpm alert:test）
#
# 使用方式：
#   cp .env.production.example .env
#   docker compose -f docker-compose.prod.yml up -d --build
# =============================================================================
version: '3.8'

services:
  # ===========================================================================
  # 1. MySQL 数据库
  # ===========================================================================
  mysql:
    image: mysql:8.0.36
    container_name: kubo-mysql
    restart: unless-stopped
    environment:
      # 生产环境禁止凭默认口令启动；由 Secret Manager/.env 显式注入。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kubo}
      MYSQL_USER: ${MYSQL_USER:-kubo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=200
      - --innodb-buffer-pool-size=512M
      - --innodb-log-file-size=128M
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
      # PITR 前置：ROW binlog + GTID，必须与 backup-mysql.sh/restore-drill.sh 一致。
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-bin=mysql-bin
      - --server-id=1
      # MySQL 8.0 uses seconds; 7 days keeps the PITR retention window explicit.
      - --binlog_expire_logs_seconds=604800
      - --max-binlog-size=100M
    volumes:
      - mysql-prod-data:/var/lib/mysql
    # 说明：schema 由后端 Flyway 迁移（10 个受控 SQL）在应用启动时自建，
    # 这里不挂 docker-entrypoint-initdb.d —— 幽灵挂载只会被 Docker 静默建成空目录。
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - kubo-prod-net

  # ===========================================================================
  # 2. Redis 缓存
  # ===========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: kubo-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - kubo-prod-net

  # ===========================================================================
  # 3. 后端服务 (Spring Boot 3.4.4 / Java 17)
  # ===========================================================================
  server:
    build:
      context: ./SPMS-Server
      dockerfile: Dockerfile
    image: kubo-server:latest
    container_name: kubo-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      AIRPOWER_API_ACCESS_TOKEN_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-kubo}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-kubo}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # 回滚杠杆：.env 的 DATA_PERMISSION_MODE 一键控制数据权限档位
      # （application-production.yml 以 ${DATA_PERMISSION_MODE:shadow} 显式占位符绑定；
      #  之前的 KUBO_DATA_PERMISSION_MODE 是失效写法 —— Spring 宽松绑定映射不到
      #  kubo.data-permission.mode，改 env 不生效，属于只有实机才暴露的事故）
      DATA_PERMISSION_MODE: ${DATA_PERMISSION_MODE:-shadow}
      # ENFORCE 发布时必须显式设为 true，防止无 user_tenant 归属账号回落默认租户。
      DATA_PERMISSION_TENANT_REQUIRED: ${DATA_PERMISSION_TENANT_REQUIRED:-true}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - kubo-prod-net

  # ===========================================================================
  # 4. 前端静态应用与反向代理 (Vue 3 + Nginx)
  # ===========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: kubo-web:latest
    container_name: kubo-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - kubo-prod-net

  # ===========================================================================
  # 5. 指标抓取 (Prometheus · 只抓编排内真实存在的服务)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: kubo-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules/alerts.prod.yml:/etc/prometheus/rules/alerts.prod.yml:ro
      - prometheus-prod-data:/prometheus
    depends_on:
      server:
        condition: service_healthy
      alertmanager:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - kubo-prod-net

  # ===========================================================================
  # 6. 告警通知 (Alertmanager · .env 渲染 webhook，零手动改配置)
  # ===========================================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: kubo-alertmanager
    restart: unless-stopped
    environment:
      KUBO_ALERT_WEBHOOK_URL: ${KUBO_ALERT_WEBHOOK_URL:?KUBO_ALERT_WEBHOOK_URL is required}
    # 模板渲染：busybox sed 把占位符替换为 .env 注入的真实 webhook 地址，
    # 写出 rendered 配置后再拉起 alertmanager —— 缺少真实地址时 compose 直接拒绝启动，禁止静默丢告警。
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s|__KUBO_ALERT_WEBHOOK_URL__|$${KUBO_ALERT_WEBHOOK_URL}|g" \
          /etc/alertmanager/alertmanager.yml.tpl > /etc/alertmanager/alertmanager.rendered.yml
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.rendered.yml --storage.path=/alertmanager
    volumes:
      - ./infra/alertmanager/alertmanager.prod.yml.tpl:/etc/alertmanager/alertmanager.yml.tpl:ro
      - alertmanager-prod-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - kubo-prod-net

networks:
  kubo-prod-net:
    driver: bridge

volumes:
  mysql-prod-data:
  redis-prod-data:
  prometheus-prod-data:
  alertmanager-prod-data:
