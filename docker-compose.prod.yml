# =============================================================================
# Kubo 生产级闭环编排（从代码到生产交付标准）
# =============================================================================
# 包含组件：
#   1. kubo-mysql  : MySQL 8.0 核心存储（持久化卷 + 自动化初始建表）
#   2. kubo-redis  : Redis 7.2 高性能缓存与分布式锁（AOF 持久化 + 密码鉴权）
#   3. kubo-server : Spring Boot 3.4.4 / Java 17 后端（非 root + 容器感知堆内存）
#   4. kubo-web    : Vue 3 + Nginx 反向代理（极小镜像 ~25MB，反代 API）
#
# 使用方式：
#   cp .env.production.example .env
#   docker compose -f docker-compose.prod.yml up -d --build
# =============================================================================
version: '3.8'

services:
  # ===========================================================================
  # 1. MySQL 数据库
  # ===========================================================================
  mysql:
    image: mysql:8.0.36
    container_name: kubo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPass_Secure_2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kubo}
      MYSQL_USER: ${MYSQL_USER:-kubo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-KuboPass_Secure_2026!}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=200
      - --innodb-buffer-pool-size=512M
      - --innodb-log-file-size=128M
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
    volumes:
      - mysql-prod-data:/var/lib/mysql
      - ./infra/init-sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - kubo-prod-net

  # ===========================================================================
  # 2. Redis 缓存
  # ===========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: kubo-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-RedisPass_Secure_2026!}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisPass_Secure_2026!}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - kubo-prod-net

  # ===========================================================================
  # 3. 后端服务 (Spring Boot 3.4.4 / Java 17)
  # ===========================================================================
  server:
    build:
      context: ./SPMS-Server
      dockerfile: Dockerfile
    image: kubo-server:latest
    container_name: kubo-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      AIRPOWER_API_ACCESS_TOKEN_SECRET: ${JWT_SECRET:-d394b981604a50d2bbfe39810cf7b6c8105e45a0b2741f2382c2b3e8fa918cb4}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-kubo}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-kubo}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-KuboPass_Secure_2026!}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisPass_Secure_2026!}
      KUBO_DATA_PERMISSION_MODE: ${DATA_PERMISSION_MODE:-shadow}
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - kubo-prod-net

  # ===========================================================================
  # 4. 前端静态应用与反向代理 (Vue 3 + Nginx)
  # ===========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: kubo-web:latest
    container_name: kubo-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - kubo-prod-net

networks:
  kubo-prod-net:
    driver: bridge

volumes:
  mysql-prod-data:
  redis-prod-data:
