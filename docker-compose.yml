# =============================================================================
# ⚠️ 本 compose 是「本地开发 + 全链路可观测」栈，不是生产编排。
#
# 生产由 k8s 承载（见 application-production.yml：kubo-mysql / kubo-redis 等服务发现），
# 本文件的凭据（MySQL root/root、RabbitMQ kubo/kubo、Nacos 默认 auth-token、MinIO kubo/kubo123456、
# Grafana admin/admin123、Elasticsearch kubo123456）全部是**弱默认值**，且端口发布到 0.0.0.0
# （形如 '3306:3306'，未绑定 127.0.0.1）。
#
# 因此**严禁**把本文件原样 `docker-compose up -d` 到公网/可被外部访问的服务器：
# 那等于把 MySQL/Redis/RabbitMQ/Nacos/MinIO/ES 连同弱凭据一起暴露在公网。
# 若确需在共享服务器上跑本栈，必须先做两件事：
#   1. 改掉全部弱默认凭据（环境变量注入，勿硬编码）；
#   2. 数据/中间件端口改为 `127.0.0.1:PORT:PORT`（仅观测 UI 可按需对外）。
# =============================================================================
version: '3.8'

services:
  # ===========================================
  # MySQL 8.0 (InnoDB Cluster 模拟 - 单节点开发模式)
  # ===========================================
  mysql:
    image: mysql:8.0.36
    container_name: kubo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kubo
      MYSQL_USER: kubo
      MYSQL_PASSWORD: kubo
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=200
      - --innodb-buffer-pool-size=1G
      - --innodb-log-file-size=256M
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-bin=mysql-bin
      - --server-id=1
      - --binlog-expire-days=7
      - --max-binlog-size=100M
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-conf:/etc/mysql/conf.d
      - ./infra/init-sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -u, root, -proot]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kubo-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ===========================================
  # Redis 7.2 (Cluster 模式 - 单节点开发模式)
  # ===========================================
  redis:
    image: redis:7.2-alpine
    container_name: kubo-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly yes
      - --maxmemory 1gb
      - --maxmemory-policy allkeys-lru
      - --save 900 1
      - --save 300 10
      - --save 60 10000
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
      - redis-conf:/usr/local/etc/redis
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - kubo-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ===========================================
  # RabbitMQ 3.12 (Quorum Queues)
  # ===========================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: kubo-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: kubo
      RABBITMQ_DEFAULT_PASS: kubo
      RABBITMQ_DEFAULT_VHOST: kubo
      RABBITMQ_DEFAULT_PERMISSIONS: '.* .* .*'
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-conf:/etc/rabbitmq
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, check_running]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kubo-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ===========================================
  # Nacos 2.3 (配置中心 + 注册中心)
  # ===========================================
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: kubo-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: kubo
      MYSQL_SERVICE_PASSWORD: kubo
      MYSQL_SERVICE_DB_PARAM: 'characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false'
      NACOS_AUTH_ENABLE: 'true'
      NACOS_AUTH_TOKEN_EXPIRE_SECONDS: '18000'
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789
    ports:
      - '8848:8848' # Nacos 端口
      - '9848:9848' # gRPC 端口
      - '9849:9849' # Raft 端口
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
      - nacos-conf:/home/nacos/conf
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:8848/nacos/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - kubo-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ===========================================
  # MinIO (对象存储)
  # ===========================================
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: kubo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kubo
      MINIO_ROOT_PASSWORD: kubo123456
      MINIO_BROWSER_REDIRECT_URL: 'http://localhost:9001'
    ports:
      - '9000:9000' # API
      - '9001:9001' # Console
    volumes:
      - minio-data:/data
      - minio-config:/root/.minio
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kubo-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ===========================================
  # Prometheus + Grafana (监控)
  # ===========================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: kubo-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    ports:
      - '9090:9090'
    volumes:
      - prometheus-data:/prometheus
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://localhost:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kubo-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:10.2.0
    container_name: kubo-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_ALLOW_ORG_CREATE: 'false'
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - '3001:3000'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kubo-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ===========================================
  # Alertmanager（告警路由/分组/去重/投递）
  # Prometheus 的 alertmanagers.targets 指向这里（9093），告警才有处可送
  # ===========================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: kubo-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - '9093:9093'
    volumes:
      - alertmanager-data:/alertmanager
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - prometheus
    networks:
      - kubo-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ===========================================
  # Node Exporter（宿主节点指标：CPU/内存/磁盘）
  # ===========================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: kubo-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - '9100:9100'
    networks:
      - kubo-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ===========================================
  # Redis Exporter（Redis 指标：内存/命中率/连接数）
  # ===========================================
  redis-exporter:
    image: oliver006/redis_exporter:v1.56.0
    container_name: kubo-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: 'redis://redis:6379'
    ports:
      - '9121:9121'
    depends_on:
      - redis
    networks:
      - kubo-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.125'
          memory: 64M

  # ===========================================
  # MySQL Exporter（MySQL 指标：连接数/慢查询/缓冲池）
  # 用 root 连（与 mysql 服务的 MYSQL_ROOT_PASSWORD: root 一致，dev 模式）；
  # 生产应改用只读监控账号（SELECT + PROCESS + REPLICATION CLIENT），勿用 root。
  # ===========================================
  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: kubo-mysql-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: 'root:root@(mysql:3306)/'
    ports:
      - '9104:9104'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kubo-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.125'
          memory: 128M

  # ===========================================
  # SkyWalking (APM 链路追踪)
  # ===========================================
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: kubo-skywalking-oap
    restart: unless-stopped
    environment:
      SW_STORAGE: elasticsearch7
      SW_STORAGE_ES_CLUSTER_NODES: elasticsearch:9200
      SW_ES_USER: elastic
      SW_ES_PASSWORD: kubo123456
    ports:
      - '11800:11800' # gRPC
      - '12800:12800' # HTTP
    volumes:
      - skywalking-oap-data:/home/skywalking/data
    depends_on:
      - elasticsearch
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:12800/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - kubo-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: kubo-skywalking-ui
    restart: unless-stopped
    environment:
      SW_OAP_ADDRESS: skywalking-oap:12800
    ports:
      - '8081:8080'
    depends_on:
      - skywalking-oap
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kubo-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ===========================================
  # Elasticsearch (SkyWalking 存储 + 日志)
  # ===========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: kubo-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=kubo123456
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - '9200:9200'
      - '9300:9300'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [CMD, curl, -f, -u, 'elastic:kubo123456', 'http://localhost:9200/_cluster/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - kubo-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ===========================================
  # Loki + Promtail (日志聚合)
  # ===========================================
  loki:
    image: grafana/loki:2.9.0
    container_name: kubo-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - '3100:3100'
    volumes:
      - loki-data:/loki
      - ./infra/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://localhost:3100/ready']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kubo-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  promtail:
    image: grafana/promtail:2.9.0
    container_name: kubo-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - kubo-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ===========================================
  # Zipkin (备选链路追踪，可选)
  # ===========================================
  # zipkin:
  #   image: openzipkin/zipkin:2.24
  #   container_name: kubo-zipkin
  #   restart: unless-stopped
  #   ports:
  #     - "9411:9411"
  #   environment:
  #     STORAGE_TYPE: mem
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9411/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 30s
  #   networks:
  #     - kubo-network

networks:
  kubo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mysql-data:
  mysql-conf:
  redis-data:
  redis-conf:
  rabbitmq-data:
  rabbitmq-conf:
  nacos-data:
  nacos-logs:
  nacos-conf:
  minio-data:
  minio-config:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  skywalking-oap-data:
  elasticsearch-data:
  loki-data:
