apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: "POST"

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: traceId
          matcherRegex: "traceId=(\\w+)"
          url: "http://skywalking-ui:8080/trace/$${__value.raw}"
          datasourceUid: "skywalking"

  - name: SkyWalking
    type: grafana-skywalking-datasource
    access: proxy
    url: http://skywalking-oap:12800
    editable: false
    jsonData:
      enableTraceQuery: true
      traceQueryMaxDuration: 300
      enableLogQuery: true
      logQueryMaxDuration: 300