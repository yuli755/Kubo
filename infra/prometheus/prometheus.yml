# Prometheus 抓取配置（docker-compose 单体部署）
# ============================================================================
# 历史版本用 kubernetes_sd_configs（K8s 服务发现），但实际部署是 docker-compose（无 K8s），
# 且配了 rabbitmq:15692 / redis-exporter:9121 / mysql-exporter:9104 等 targets，而这些
# exporter 服务当时根本不在 compose 里 —— 属于「愿景态配置，从未真正闭环」。
# 本次改为与 docker-compose.yml 一一对应的静态 targets，只有真实存在的服务才会被 scrape。
#
# 应用层指标（JVM/HTTP/HikariCP）依赖后端 pom 引入 micrometer-registry-prometheus 并在
# management 暴露 /actuator/prometheus，属于「后端理论代码」批次；本文件先以注释占位，
# 待后端容器化进 compose 后启用（见文末 spring-boot-actuator 段）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: kubo-dev
    environment: development

alerting:
  alertmanagers:
    - static_configs:
        # 告警必须「有处可送」：历史是空 targets []，告警触发也无处投递。
        # alertmanager 服务已在 docker-compose.yml 定义（9093）。
        - targets:
            - 'alertmanager:9093'

rule_files:
  - 'rules/*.yml'

scrape_configs:
  # Prometheus 自身
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # 节点级指标（CPU/内存/磁盘/文件系统）—— node-exporter 服务（compose）
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # Redis 指标（内存/命中率/连接数）—— redis-exporter 服务（compose，连 redis:6379）
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  # MySQL 指标（连接数/慢查询/缓冲池）—— mysql-exporter 服务（compose，连 mysql:3306）
  - job_name: mysql
    static_configs:
      - targets: ['mysql-exporter:9104']

  # ------------------------------------------------------------------------
  # 应用层（Spring Boot Actuator）指标 —— 依赖后端 pom 的 micrometer-registry-prometheus
  # 与 application-production.yml 的 management.exposure 追加 prometheus（均已落地）。
  # target 用 host.docker.internal 占位：当前后端在宿主单独跑（未容器化进 compose）；
  # 后端容器化进 compose 后改为 kubo-server:8080。后端未引入 micrometer 前，此 target
  # 会抓取失败（up=0），触发 TargetDown 告警 —— 这本身就是「应用层指标没接好」的正确信号。
  - job_name: spring-boot-actuator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']
