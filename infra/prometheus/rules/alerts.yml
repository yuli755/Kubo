# 告警规则（docker-compose 单体部署 · 最小可用集）
# ============================================================================
# 原则：每条告警都必须「可行动」，且引用的指标必须是 Prometheus 真实采集得到的。
# 历史版本 346 行里大量规则引用代码从未暴露的指标（rabbitmq_* / ws_* / inventory_* /
# order_* / auth_login_failed_total / mysql_slave_status_seconds_behind_master），
# 这些要么组件根本没接（RabbitMQ 代码未接、无主从），要么是纯愿景指标 —— 告警永远
# 静默不触发或误报。本次瘦身为「基础设施层真实可采集」的最小集（up/node/redis/mysql）。
#
# 应用层（jvm_* / http_server_requests_*）依赖后端引入 micrometer-registry-prometheus，
# 属「后端理论代码」批；规则阈值已标定，先整段注释挂起，待端点就绪后取消注释启用。
# 通道（alertmanager）已接通，见 infra/alertmanager/alertmanager.yml 与 docker-compose.yml。
#
# 阈值均为默认值，需按真实负载标定（见 docs/可观测性与告警加固方案.md §3）。
groups:
  - name: kubo-platform-critical
    interval: 30s
    rules:
      # ==================== 实例存活 ====================
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: '监控目标 {{ $labels.job }} / {{ $labels.instance }} 停止响应'
          description: '监控目标 {{ $labels.job }} / {{ $labels.instance }} 已停止响应超过 1 分钟'

      # ==================== 节点级（node-exporter） ====================
      - alert: DiskSpaceHigh
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: '磁盘空间不足（节点 {{ $labels.instance }}）'
          description: '节点 {{ $labels.instance }} 根分区剩余空间不足 15%（{{ $value | humanizePercentage }}）'

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.05
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: '磁盘空间严重不足（节点 {{ $labels.instance }}）'
          description: '节点 {{ $labels.instance }} 根分区剩余空间不足 5%，即将写入失败'

      - alert: CPUHighLoad
        expr: (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'CPU 负载过高（节点 {{ $labels.instance }}）'
          description: '节点 {{ $labels.instance }} CPU 使用率 {{ $value | humanizePercentage }}'

      # ==================== Redis（redis-exporter） ====================
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Redis 内存使用率超过 85%'
          description: 'Redis 内存使用率 {{ $value | humanizePercentage }}'

      - alert: RedisMemoryCritical
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.95
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Redis 内存即将耗尽'
          description: 'Redis 内存使用率 {{ $value | humanizePercentage }}，即将触发淘汰策略'

      - alert: RedisConnectionsHigh
        expr: redis_connected_clients / redis_config_maxclients > 0.8
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Redis 连接数使用率超过 80%'
          description: 'Redis 连接数使用率 {{ $value | humanizePercentage }}'

      - alert: RedisHitRateLow
        expr: (redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total)) < 0.8
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Redis 命中率过低'
          description: 'Redis 缓存命中率 {{ $value | humanizePercentage }}，低于 80%'

      # ==================== MySQL（mysqld-exporter） ====================
      - alert: MySQLConnectionsHigh
        expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          team: dba
        annotations:
          summary: 'MySQL 连接数使用率超过 80%'
          description: 'MySQL 连接数使用率 {{ $value | humanizePercentage }}，接近上限'

      - alert: MySQLConnectionsCritical
        expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections > 0.95
        for: 2m
        labels:
          severity: critical
          team: dba
        annotations:
          summary: 'MySQL 连接数即将耗尽'
          description: 'MySQL 连接数使用率 {{ $value | humanizePercentage }}，即将耗尽'

      - alert: MySQLSlowQueriesHigh
        expr: rate(mysql_global_status_slow_queries[5m]) > 10
        for: 5m
        labels:
          severity: warning
          team: dba
        annotations:
          summary: 'MySQL 慢查询过多'
          description: 'MySQL 慢查询每秒超过 10 条，需要优化'

  # ==========================================================================
  # 应用层告警：依赖后端 pom 的 micrometer-registry-prometheus（已落地）+ 生产暴露
  # /actuator/prometheus。后端未引入 micrometer 前这些指标不存在，规则静默不触发
  # （属预期过渡态，不是误报）。阈值已标定，启用前无需重标。
  - name: kubo-platform-application
    interval: 30s
    rules:
      - alert: JVMMemoryHigh
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'JVM 堆内存使用率过高'
          description: '{{ $labels.instance }} 堆内存使用率 {{ $value | humanizePercentage }}，超过 85%'

      - alert: JVMMemoryCritical
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.95
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'JVM 堆内存使用率严重过高'
          description: '{{ $labels.instance }} 堆内存使用率 {{ $value | humanizePercentage }}，超过 95%，即将 OOM'

      - alert: JVMGCPressure
        expr: rate(jvm_gc_pause_seconds_sum[5m]) / rate(jvm_gc_pause_seconds_count[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'JVM GC 压力过大'
          description: '{{ $labels.instance }} 平均 GC 暂停时间过长，可能存在内存泄漏或堆过小'

      - alert: JVMThreadCountHigh
        expr: jvm_threads_live > 500
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'JVM 线程数过高'
          description: '{{ $labels.instance }} 存活线程数 {{ $value }}，超过 500，可能存在线程泄漏'

      - alert: APIHighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[1m])) by (service) / sum(rate(http_server_requests_seconds_count[1m])) by (service) > 0.05
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: '{{ $labels.service }} 错误率超过 5%'
          description: '{{ $labels.service }} 5xx 错误率 {{ $value | humanizePercentage }}，持续超过 2 分钟'

      - alert: APIHighLatency
        expr: histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service)) > 2
        for: 3m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: '{{ $labels.service }} P99 延迟超过 2s'
          description: '{{ $labels.service }} P99 延迟 {{ $value | humanizeDuration }}，持续超过 3 分钟'

      - alert: UnauthorizedAccessAttempts
        expr: rate(http_server_requests_seconds_count{status="403"}[5m]) > 50
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: '非授权访问尝试异常'
          description: '403 错误每分钟超过 50 次，可能存在恶意探测'
