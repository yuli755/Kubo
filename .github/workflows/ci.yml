name: CI

# 说明：
# - web 这个 job 是**门禁**（前端 F0 起生效）：lint / 类型 / 单测 / 构建 / 体积预算任一不过即失败。
# - server 的 compile 是硬门禁；test 暂时 continue-on-error（后端集成用例依赖 DB/Redis，
#   待 P1 用 Testcontainers 收口后翻成必过）。不要因为"本地跑不过"就直接注掉整个 job。

on:
  push:
    # arena/** 是 Agent 会话的工作分支：不加进来的话，这里所有硬门禁（含 server compile）
    # 在推送当刻都不会跑，"已实测"就只能停在沙箱里（详见 docs §18.6）。
    branches: [main, master, 'feat/**', 'arena/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint / typecheck / test / build / size)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 不要再传 version：package.json 已有 "packageManager": "pnpm@9.0.0"，
      # pnpm/action-setup@v4 对"两处都指定版本"直接报错退出（本仓的 web job 因此从未跑起来过）。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Permission codes match backend controllers
        run: pnpm perms:check

      # 两类"文本级但没人管"的问题：中文被 U+FFFD 污染（不影响编译，只在页面上显形）、
      # Java 源码里的单反斜杠转义（影响编译，但沙箱没有 JDK —— 见 docs §18.2 与 §19.9）
      - name: Source text integrity (no U+FFFD / no bad Java escapes)
        run: pnpm text:check

      - name: Build
        run: pnpm build

      # 双指标：首屏关键路径（index.html + 静态 import 闭包）与总量分别设预算。
      # 历史口径"所有产物 gzip < 800KB"含懒加载分包，导致无法判定达标与否；
      # 预算数字改动必须连同理由写进 docs/数据权限目标态落地施工图.md 的决策记录。
      - name: Bundle size budget
        run: pnpm size -- --entry-budget 450 --total-budget 900 --json dist/size-report.json

      - name: Upload size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: dist/size-report.json
          if-no-files-found: ignore

  server:
    name: Server (compile / test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SPMS-Server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17
          cache: maven

      - name: Compile
        # 失败原因要用 ::error:: 显式写成 annotation：Actions 的日志正文放在 blob 存储上，
        # 某些网络环境取不到（本仓踩过一次：CI 红了但谁都读不到为什么红）。
        # annotation 走普通 REST，人和脚本都拿得到，编译错误才不会沦为"失败但无声"。
        run: |
          set +e
          # 126 = 找到命令但不可执行。mvnw 曾以 100644 提交进仓库，于是 server job 从第一天起
          # 就没真正编译过后端（"CI 是绿的/红的"与"后端有没有被验证过"完全是两件事）。
          # 这里显式补一次执行位，避免任何人再次提交时丢掉它。
          chmod +x ./mvnw || true
          ./mvnw -B -s settings.xml -DskipTests compile 2>&1 | tee /tmp/mvn-compile.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 错误提取放在 infra/scripts/maven-error-annotations.mjs：它只取 `*.java:[行,列]` 那种可定位
            # 的行、去重（Maven 同一批会打两遍）、按文件排序，再写成 `::error file=...,line=...`。
            # 之所以不用内联 sed：GitHub 每个 check run 只留 10 条 annotation，
            # 逻辑必须能在本地用样例日志验（本仓踩过"CI 红了但读不到为什么红"）。
            node ../infra/scripts/maven-error-annotations.mjs /tmp/mvn-compile.log || true
          fi
          exit "$status"

      - name: Unit & slice tests
        # 2026-09-06：这行 `continue-on-error: true` 被删掉了，因为 CI 里 145 个用例连续通过
        # （含 @SpringBootTest + H2 的缓存/事件/多租户隔离用例）。从这一刻起"后端测试红着也能合"不再成立。
        # 它证明的边界要看清：跑的是 H2 + schema-test.sql，**不等于**真实库 schema 与方言正确性
        # （行级 SQL 在生产 MySQL 上的行为仍需 shadow 模式实采，见 docs §19.10 末）。
        run: |
          set +e
          chmod +x ./mvnw || true
          ./mvnw -B -s settings.xml test 2>&1 | tee /tmp/mvn-test.log
          status=${PIPESTATUS[0]}
          # 先读 surefire 的结构化报告（用例总数 + 每个失败用例钉到源码行），再兜底提编译错误。
          # 之所以两步都要：test-compile 挂掉时**没有**报告目录，这时候唯一能看到的信息在日志里；
          # 而报告存在时它比日志准确得多（含断言消息，不会被 Maven 的汇总噪音挤掉）。
          node ../infra/scripts/surefire-summary.mjs target/surefire-reports --max 9 || true
          if ! ls target/surefire-reports/TEST-*.xml >/dev/null 2>&1; then
            # 空转防护：`mvn test` 在"一个用例都没跑"时也是 exit 0（比如哪天有人加了 -DskipTests
            # 或把所有类改名）。这一步的绿必须是"跑过用例"的绿。
            echo "::error::没有 surefire 报告（target/surefire-reports/TEST-*.xml 为空）：测试没有被执行，这一步不算通过"
            status=1
          fi
          if [ "$status" -ne 0 ] && ! ls target/surefire-reports/TEST-*.xml >/dev/null 2>&1; then
            # 只在"测试根本没跑起来"时才回到日志兜底（test-compile 挂了就没有报告目录）。
            # 有报告时以报告为准：再把日志尾部贴一遍，只会把 10 条 annotation 的名额占光，
            # 把真正要看的失败用例挤掉。
            node ../infra/scripts/maven-error-annotations.mjs /tmp/mvn-test.log --max 6 || true
          fi
          exit "$status"

      - name: Framework intel (dispatch only)
        # 只在手动触发时跑：这是"沙箱看不到框架 jar"的侦察通道（docs §19.9 说明了为什么日志正文读不到、
        # 只能用 annotation），不是回归门禁 —— 挂在每次 push 上等于白花两分钟换一堆没人看的字。
        # 触发：gh workflow run ci.yml --ref <分支>
        # 触发方式二选一：手动 dispatch，或 commit message 里带 [probe]。
        # 后者不是凑合：本仓的 CI 凭证没有 workflows:write，`gh workflow run` 会 403，
        # 于是"只能手动触发的诊断"实际上等于不能触发 —— 用提交信息当开关，
        # 让诊断通道不依赖额外权限，也不会挂在每次 push 上白花两分钟。
        # always()：前面步骤红了也要拿到情报（依赖装不上时恰恰最需要）。
        if: >-
          always() && (github.event_name == 'workflow_dispatch' ||
          contains(github.event.head_commit.message, '[probe]'))
        run: |
          set +e
          chmod +x ./mvnw || true
          ./mvnw -B -s settings.xml -q dependency:build-classpath -Dmdep.outputFile=/tmp/cp.txt >/dev/null 2>&1
          # 本轮要验证的假设很具体：导出的"行"到底是 Jackson 序列化出来的（那 @SensitiveField
          # 已经天然把导出遮住了，界面与文件一致），还是 CurdUtil 反射字段拼出来的（那必须另做一层）。
          node ../infra/scripts/framework-intel.mjs --cp /tmp/cp.txt --chunks 8 \
            --classes cn.hamm.airpower.curd.base.CurdController,cn.hamm.airpower.curd.base.CurdService,cn.hamm.airpower.curd.base.CurdUtil,cn.hamm.airpower.curd.model.query.QueryExport

      - name: Reject forbidden dependencies
        run: |
          set -e
          # 架构红线（见 docs/二次改造前后端推进路线与可行性建议.md）：
          # 不得引入 AMQP 之外的消息中间件客户端；MyBatis 必须与 MyBatis-Plus 同版本族。
          tree=$(./mvnw -B -s settings.xml -q dependency:tree || true)
          if echo "$tree" | grep -Ei "kafka-clients|rocketmq-client|spring-boot-starter-artemis"; then
            echo "禁止引入上述 MQ 客户端"; exit 1
          fi
