name: CI

# 说明：
# - web 这个 job 是**门禁**（前端 F0 起生效）：lint / 类型 / 单测 / 构建 / 体积预算任一不过即失败。
# - server 的 compile 与 test **都是硬门禁**（§19.10：删掉 continue-on-error 并加"没有 surefire
#   报告即失败"的空转防护）。历史上这里曾经是 continue-on-error —— 那等于把红涂成绿，别改回去。
# - migrations 这个 job 用真实 MySQL 8 跑迁移脚本：H2 与 schema-test.sql 都是手抄件，
#   MySQL 方言（存储过程/DELIMITER/information_schema/生成列）只有真库能判。

on:
  push:
    # arena/** 是 Agent 会话的工作分支：不加进来的话，这里所有硬门禁（含 server compile）
    # 在推送当刻都不会跑，"已实测"就只能停在沙箱里（详见 docs §18.6）。
    # dev 是双远端同步的共享集成分支；不触发 CI 会让已推送提交缺少硬门禁证据。
    branches: [main, master, dev, 'feat/**', 'arena/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review (PR gate)
    # 供应链安全门禁：PR 上检查「新增依赖」是否带已知漏洞（CVE/GHSA）。
    # 与 web/server 的存量测试互补——那些只验证「改完还能跑」，这里验证「新引进来的是干净的」。
    # 用 GitHub 依赖图谱做比对，不下载 NVD 数据库，几秒出结果，挂在每次 PR 上零负担。
    # 前提：public 仓库免费；private 仓库需 GitHub Advanced Security（免费版不含）。若当前仓库
    # 是 private 且未开通 GHAS，本 job 会以 license 错误失败——届时按需降级为 dependabot.yml 的
    # 自动告警（仅持续监控、不阻断 PR）。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          # high 及以上（high/critical）的新增漏洞依赖即阻断合入；moderate/low 只提示不阻断，
          # 避免「低危升级把 PR 卡死」拖慢正常依赖升级（Dependabot PR 尤其常见）。
          fail-on-severity: high
          # 补依赖变更说明：让审阅者一眼看到本次 PR 增删了哪些依赖、各自是什么许可证/风险。
          comment-summary-in-pr: always

  web:
    name: Web (lint / typecheck / test / build / size)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 不要再传 version：package.json 已有 "packageManager": "pnpm@9.0.0"，
      # pnpm/action-setup@v4 对"两处都指定版本"直接报错退出（本仓的 web job 因此从未跑起来过）。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:ci

      - name: airpower 退场门禁（前端：不得再出现 @airpower 引用）
        run: pnpm airpower:check

      - name: 后端 airpower 棘轮（足迹只许降）
        run: pnpm airpower:backend -- --check

      # 2026-09-18 起后端不再继承 cn.hamm:airpower 父 POM（退场 B0），构建基线自持：
      # 少写版本号的依赖、没定义的 ${...} 属性、被继承回来的发版插件都会变成构建期报错。
      # 这三类不需要 JDK/Maven 就能查，所以放在没有 java 的 web job 里跑。
      - name: POM 自持校验（无版本依赖 / 悬空属性 / 发版插件残留）
        run: pnpm pom:check

      # 换底座/砍功能之后最容易留下的东西：**没有任何 import 指向的文件**（旧适配器、被替代的
      # 组件、删了一半的模块）。它们不进 bundle，体积门禁与测试都发现不了，只能靠静态引用图。
      # 脚本保守判定：相对路径/别名/动态 import/路径字符串（路由与菜单靠字符串懒加载页面）都算引用；
      # 视图页不参与删除判定（页面级孤儿由 menuContract.spec.ts 用真实菜单树对账）。
      - name: No unreferenced frontend files (dead code)
        run: pnpm deadcode:check

      # 文件级之外还有导出级：文件在用，但里面某些 `export` 全仓没人 import
      # （重构只删调用方忘了删定义、内部辅助被顺手 export）。尺度与上面一致：
      # 只要有人 import、或**测试文本里提到**（本仓有读源码字符串的契约测试）就不算死。
      - name: No unreferenced exports
        run: pnpm exports:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Permission codes match backend controllers
        run: pnpm perms:check

      # 每个 HTTP 端点都必须有显式 @Permission（类级或方法级），不得依赖 airpower「无注解=无需登录」隐式默认
      # —— 历史真实漏洞：OauthController.unBindThird 匿名可删任意用户第三方登录绑定
      - name: Every HTTP endpoint has explicit @Permission
        run: pnpm auth:check

      # 403 只承载「授权失败」（与已评审保留的业务规则拒绝）：查不到行、输入非法、服务端配置缺失
      # 都不得用 FORBIDDEN —— 否则监控把它记成越权尝试，前端还会给"找管理员开权限"的假指引
      - name: Error code semantics (403 is not a catch-all failure code)
        run: pnpm errcode:check

      # 前端拼出的每个端点都必须存在于后端路由表。基路径来自自定义 @Api、端点集合来自 @Extends 显式开关，
      # 全后端零路径变量（一律 POST /{base}/{action}，参数在 body）—— 拼错就是真机 HTTP 404，
      # 而 Spring 默认 404 响应体没有 code/message，页面只能说「请求失败」。
      # 历史上已废掉三处：getTreeList（写成 getList 的悬空别名）、getDetail/{id}（编辑回填全挂）、
      # setBillDetailsAllFinished（服务内部方法，不是接口）。演示 mock 与单测都拦不住：mock 对末段数字特判，
      # 单测断言的是前端自己拼的字符串。
      - name: API contract (frontend endpoints must exist in backend route table)
        run: pnpm contract:check

      # 两类"文本级但没人管"的问题：中文被 U+FFFD 污染（不影响编译，只在页面上显形）、
      # Java 源码里的单反斜杠转义（影响编译，但沙箱没有 JDK —— 见 docs §18.2 与 §19.9）
      - name: Source text integrity (encoding / Java literals / gate self-test)
        run: pnpm text:check

      - name: Migration DDL vs JPA entity drift
        run: pnpm ddl:check

      # 迁移脚本的 MySQL 8 方言「静态」完整性（DELIMITER/存储过程/幂等性/动态 SQL 配平）：
      # 不连库、读文件就能判定的确定性错误在提交前拦住，真库 job（migrations）只验证真正需要
      # 真库验证的东西（information_schema 反向核对、连跑两遍判幂等）。沙箱无 MySQL，此步本地可跑。
      - name: Migration dialect syntax integrity (static)
        run: pnpm migration:check

      # 监控/告警配置（prometheus/alerts/alertmanager/docker-compose）的静态完整性：
      # YAML 语法、alertmanager 有处可送、target 指向真实存在的服务、alerts 不引用未暴露的愿景指标。
      # 历史版本是「愿景态半成品」（k8s 服务发现 + 空 alertmanager + 引用未埋点指标），
      # 沙箱无 Prometheus/Alertmanager，此步本地可跑、拦住读文件就能判定的错。
      - name: Monitoring & alerting config integrity (static)
        run: pnpm monitoring:check

      - name: Data permission canary readiness gate
        run: pnpm canary:check

      - name: Docker slimming and production orchestration gate
        run: pnpm docker:check

      # 备份/恢复演练脚本的静态完整性：恢复脚本必须带「拒绝生产库」护栏、必须 fail-fast、
      # 备份必须 gzip -t 校验。沙箱无 docker/MySQL，真实恢复行为靠隔离环境跑脚本，此步拦
      # 「读文件就能看出来的错」（见 docs/恢复演练DR-Runbook.md）。
      - name: Backup & restore drill scripts integrity (static)
        run: pnpm drill:check

      - name: Build
        run: pnpm build

      # 演示模式产物门禁：演示模式会替换请求适配器并预置登录态（等于绕过登录后的门），
      # 必须先构图再扫产物（见 infra/scripts/check-demo-build.mjs 的三道闸说明）。
      - name: Demo-mode artifact gate
        run: pnpm demo:check

      # 双指标：首屏关键路径（index.html + 静态 import 闭包）与总量分别设预算。
      # 历史口径"所有产物 gzip < 800KB"含懒加载分包，导致无法判定达标与否；
      # 预算数字改动必须连同理由写进 docs/数据权限目标态落地施工图.md 的决策记录。
      - name: Bundle size budget
        run: pnpm size -- --entry-budget 450 --total-budget 900 --json dist/size-report.json

      - name: Upload size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-report
          path: dist/size-report.json
          if-no-files-found: ignore

  server:
    name: Server (compile / test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SPMS-Server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 17
          cache: maven

      # 无 Maven 依赖：全量源码 AST + 独立工具真实编译/契约；不能替代整仓类型检查与集成测试。
      - name: Java 17 source parse and utility contracts
        run: node ../infra/scripts/test-backend-utilities.mjs

      - name: Compile
        # 失败原因要用 ::error:: 显式写成 annotation：Actions 的日志正文放在 blob 存储上，
        # 某些网络环境取不到（本仓踩过一次：CI 红了但谁都读不到为什么红）。
        # annotation 走普通 REST，人和脚本都拿得到，编译错误才不会沦为"失败但无声"。
        run: |
          set +e
          # 126 = 找到命令但不可执行。mvnw 曾以 100644 提交进仓库，于是 server job 从第一天起
          # 就没真正编译过后端（"CI 是绿的/红的"与"后端有没有被验证过"完全是两件事）。
          # 这里显式补一次执行位，避免任何人再次提交时丢掉它。
          chmod +x ./mvnw || true
          ./mvnw -B -s settings.xml -DskipTests compile 2>&1 | tee /tmp/mvn-compile.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 错误提取放在 infra/scripts/maven-error-annotations.mjs：它只取 `*.java:[行,列]` 那种可定位
            # 的行、去重（Maven 同一批会打两遍）、按文件排序，再写成 `::error file=...,line=...`。
            # 之所以不用内联 sed：GitHub 每个 check run 只留 10 条 annotation，
            # 逻辑必须能在本地用样例日志验（本仓踩过"CI 红了但读不到为什么红"）。
            node ../infra/scripts/maven-error-annotations.mjs /tmp/mvn-compile.log || true
          fi
          exit "$status"

      # Compile 已解析正式依赖；再以隔离 classpath 验证存储/事件 JSON，缺包或校验和不符必须失败。
      - name: JSON contracts with verified Jackson artifacts
        run: node ../infra/scripts/test-backend-json.mjs

      - name: Cookie contracts with verified Spring and Servlet artifacts
        run: node ../infra/scripts/test-backend-cookie.mjs

      - name: HTTP error contracts with verified Spring MVC and legacy boundary
        run: node ../infra/scripts/test-backend-http.mjs

      - name: Unit & slice tests
        # 2026-09-06：这行 `continue-on-error: true` 被删掉了，因为 CI 里 145 个用例连续通过
        # （含 @SpringBootTest + H2 的缓存/事件/多租户隔离用例）。从这一刻起"后端测试红着也能合"不再成立。
        # 它证明的边界要看清：跑的是 H2 + schema-test.sql，**不等于**真实库 schema 与方言正确性
        # （行级 SQL 在生产 MySQL 上的行为仍需 shadow 模式实采，见 docs §19.10 末）。
        run: |
          set +e
          chmod +x ./mvnw || true
          ./mvnw -B -s settings.xml test 2>&1 | tee /tmp/mvn-test.log
          status=${PIPESTATUS[0]}
          # 先读 surefire 的结构化报告（用例总数 + 每个失败用例钉到源码行），再兜底提编译错误。
          # 之所以两步都要：test-compile 挂掉时**没有**报告目录，这时候唯一能看到的信息在日志里；
          # 而报告存在时它比日志准确得多（含断言消息，不会被 Maven 的汇总噪音挤掉）。
          node ../infra/scripts/surefire-summary.mjs target/surefire-reports --max 9 || true
          if ! ls target/surefire-reports/TEST-*.xml >/dev/null 2>&1; then
            # 空转防护：`mvn test` 在"一个用例都没跑"时也是 exit 0（比如哪天有人加了 -DskipTests
            # 或把所有类改名）。这一步的绿必须是"跑过用例"的绿。
            echo "::error::没有 surefire 报告（target/surefire-reports/TEST-*.xml 为空）：测试没有被执行，这一步不算通过"
            status=1
          fi
          if [ "$status" -ne 0 ] && ! ls target/surefire-reports/TEST-*.xml >/dev/null 2>&1; then
            # 只在"测试根本没跑起来"时才回到日志兜底（test-compile 挂了就没有报告目录）。
            # 有报告时以报告为准：再把日志尾部贴一遍，只会把 10 条 annotation 的名额占光，
            # 把真正要看的失败用例挤掉。
            node ../infra/scripts/maven-error-annotations.mjs /tmp/mvn-test.log --max 6 || true
          fi
          exit "$status"

      - name: Framework intel (dispatch only)
        # 只在手动触发时跑：这是"沙箱看不到框架 jar"的侦察通道（docs §19.9 说明了为什么日志正文读不到、
        # 只能用 annotation），不是回归门禁 —— 挂在每次 push 上等于白花两分钟换一堆没人看的字。
        # 触发：gh workflow run ci.yml --ref <分支>
        # 触发方式二选一：手动 dispatch，或 commit message 里带 [probe]。
        # 后者不是凑合：本仓的 CI 凭证没有 workflows:write，`gh workflow run` 会 403，
        # 于是"只能手动触发的诊断"实际上等于不能触发 —— 用提交信息当开关，
        # 让诊断通道不依赖额外权限，也不会挂在每次 push 上白花两分钟。
        # always()：前面步骤红了也要拿到情报（依赖装不上时恰恰最需要）。
        if: >-
          always() && (github.event_name == 'workflow_dispatch' ||
          contains(github.event.head_commit.message, '[probe]'))
        run: |
          set +e
          chmod +x ./mvnw || true
          ./mvnw -B -s settings.xml -q dependency:build-classpath -Dmdep.outputFile=/tmp/cp.txt >/dev/null 2>&1
          # 本轮要验证的假设很具体：导出的"行"到底是 Jackson 序列化出来的（那 @SensitiveField
          # 已经天然把导出遮住了，界面与文件一致），还是 CurdUtil 反射字段拼出来的（那必须另做一层）。
          node ../infra/scripts/framework-intel.mjs --cp /tmp/cp.txt --chunks 8 \
            --classes cn.hamm.airpower.curd.helper.ExportHelper,cn.hamm.airpower.core.CollectionUtil,cn.hamm.airpower.core.TaskUtil,cn.hamm.airpower.curd.base.CurdController,cn.hamm.airpower.curd.base.CurdService

      - name: Reject forbidden dependencies
        run: |
          set -e
          # 架构红线（见 docs/archive/二次改造前后端推进路线与可行性建议.md，已归档）：
          # 不得引入 AMQP 之外的消息中间件客户端；MyBatis 必须与 MyBatis-Plus 同版本族。
          # 【2026-09-08 修的一处空转】原来是 `-q dependency:tree`：dependency:tree 是通过 INFO 日志
          # 输出的，`-q` 把它整个压掉 ⇒ $tree 恒为空 ⇒ 下面两条红线 grep 的永远是空串，"通过"是假的。
          # 正确姿势是 -DoutputFile（写文件，与 -q 无关），并且**必须验文件非空**：
          # 任何 grep 型门禁都得能区分"没问题"和"没数据"，这和第 131 行那条
          # "mvn test 零用例也 exit 0"防空转是同一个 bug 的另一副面孔。
          tree_file="$RUNNER_TEMP/deptree.txt"
          rm -f "$tree_file"
          ./mvnw -B -s settings.xml dependency:tree -DoutputFile="$tree_file" -DappendOutput=true >/dev/null
          if [ ! -s "$tree_file" ]; then
            echo "依赖树是空的 —— 红线无法判定（这不是"没问题"）"; exit 1
          fi
          tree=$(cat "$tree_file")
          # Cookie 模块已在 POM 排除。必须核对真正解析的依赖树，不能只靠源码 grep 或 exclusion 声明。
          if grep -Fq 'cn.hamm:airpower-cookie:' "$tree_file"; then
            echo "::error::已退场的 airpower-cookie 仍出现在解析后的依赖树"; exit 1
          fi
          echo "依赖树行数：$(wc -l < "$tree_file")（红线在此行数上判定）"
          if echo "$tree" | grep -Ei "kafka-clients|rocketmq-client|spring-boot-starter-artemis"; then
            echo "禁止引入上述 MQ 客户端"; exit 1
          fi
          # MyBatis-Plus 成对红线（§19.33）：3.5.9 起 JSqlParser 被拆成独立 artifact，只引 starter 不引
          # mybatis-plus-jsqlparser 时，编译与启动都正常，直到第一个走 InnerInterceptor 的查询
          # 才 NoClassDefFoundError —— 这类"要到用户点上列表页才炸"的依赖错误必须由 CI 拦掉。
          mp_starter=$(echo "$tree" | grep -oE "com\.baomidou:mybatis-plus-spring-boot3-starter:jar:[0-9][^:]*" | head -1 | awk -F: "{print \$NF}")
          mp_parser=$(echo "$tree" | grep -oE "com\.baomidou:mybatis-plus-jsqlparser:jar:[0-9][^:]*" | head -1 | awk -F: "{print \$NF}")
          if [ -n "$mp_starter" ] && [ -z "$mp_parser" ]; then
            echo "有 mybatis-plus starter（$mp_starter）却没有 mybatis-plus-jsqlparser：分页/数据权限插件第一次解析 SQL 就会炸"; exit 1
          fi
          if [ -n "$mp_starter" ] && [ "$mp_starter" != "$mp_parser" ]; then
            echo "mybatis-plus 与 jsqlparser 版本必须一致（starter=$mp_starter jsqlparser=$mp_parser）"; exit 1
          fi
          echo "MyBatis-Plus 依赖成对性检查通过（starter=${mp_starter:-未引入}）"
          # jsqlparser 本体在不在、什么版本，一律由依赖树给结论。这里原先写着"mybatis-plus-jsqlparser
          # 不传递 jsqlparser 本体"——那是误判：它错在「依赖树被 -q 压成空串」+「一次 CNFE 被读成缺 jar」
          # 两层叠加。实测结论（本体在场，jsqlparser:5.0）与教训见文档 §19.33。
          parser_lines=$(echo "$tree" | grep -i "jsqlparser" | tr '\n' ' ' | sed 's/%/%25/g' || true)
          echo "::notice title=jsqlparser 就绪性（§19.33）::${parser_lines:-依赖树里没有 jsqlparser 本体：任何 InnerInterceptor 还不能接}"
          # 版本不去中央仓库抓 POM（那抓到的是模块自身版本，本轮就这么打出过一条误导的"应配版本 3.5.9"），
          # 只读依赖树里传递进来的实际版本；下一格核对版本族看这一行，不照记忆写。
          jsql_ver=$(echo "$tree" | grep -oE "com\.github\.jsqlparser:jsqlparser:jar:[0-9][^:]*" | head -1 | awk -F: '{print $NF}')
          echo "::notice title=jsqlparser 本体版本（依赖树实测）::${jsql_ver:-不在依赖树里 ⇒ 接任何 InnerInterceptor 前必须显式补}"

      - name: Dependency analysis report (informational)
        # 依赖瘦身的前置侦察（P3 #2）：dependency:analyze 输出「声明了却没用」与「用了却未声明」两类，
        # 是后续剪依赖的输入。刻意**不设为门禁**：analyze 插件对 Lombok/反射/运行期才加载的依赖有已知误报，
        # 拿它当红灯会把正常依赖升级卡死。报告以 artifact 上传（Actions 日志正文在 blob 上取不到，
        # 本仓踩过「CI 红了但读不到为什么红」），供人工对照剪。
        run: |
          chmod +x ./mvnw || true
          ./mvnw -B -s settings.xml dependency:analyze > target/dependency-analyze.txt 2>&1 || true
          echo "dependency:analyze 报告已写入 target/dependency-analyze.txt（非门禁，失败不阻断）"

      - name: Upload dependency analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-analyze-report
          path: SPMS-Server/target/dependency-analyze.txt
          if-no-files-found: ignore
  # ============================================================================
  # 迁移脚本的真实方言门禁（§19.11 第 2 项里"今天就能自动化"的那一半）
  # 为什么不用 Testcontainers：那要往 pom 里加 testcontainers + mysql-connector 依赖，
  # 本 job 只要一个 service 容器 + mysql CLI，判定的却是同一件事（脚本能否在 MySQL 8 上执行、
  # 是否真幂等、建出来的列是否与脚本一致），而 H2 + schema-test.sql 那份手抄件永远判不出方言问题。
  # 红线：这里跑的是 `src/main/resources/db/migration` 下的**生产迁移脚本**（Flyway 版本化，
  # 2026-09 的 S0 从 `docs/database/migration/` 收编过来），绝不拿 schema-test.sql 顶替它。
  # ============================================================================
  migrations:
    name: Migrations (MySQL 8 dialect / idempotency)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: kubo_ci
          MYSQL_DATABASE: kubo_ddl_check
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ukubo_ci -pkubo_ci --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=24
    steps:
      - uses: actions/checkout@v4

      - name: Ensure mysql client
        run: |
          set -e
          if command -v mysql >/dev/null 2>&1; then
            mysql --version
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq mysql-client
          fi

      - name: Apply every migration twice
        # 这一步刻意不用 set -e：首跑要的是"到底哪儿不对"，而不是一个 exit 1。
        # 所有事实先写进 annotation（note），最后才按判据失败 —— 沙箱里读不到 Actions 日志正文，
        # annotation 是唯一能看见证据的通道。三条判据一条都没放松。
        run: |
          note() {
            printf '::notice title=%s::%s\n' "$1" "$(printf '%s' "$2" | sed 's/%/%25/g; s/\r/%0D/g; s/$/%0A/g' | tr -d '\n')"
          }
          MYSQL="mysql --force --default-character-set=utf8mb4 -h 127.0.0.1 -P 3306 -uroot -pkubo_ci kubo_ddl_check"
          note "00-env" "$(command -v mysql; mysql --version 2>&1 | head -1)"
          $MYSQL -e "SELECT 'connected' AS ok" > /tmp/ping.txt 2> /tmp/ping.err
          ping_rc=$?
          note "01-connect" "rc=$ping_rc out=$(cat /tmp/ping.txt) err=$(head -c 300 /tmp/ping.err)"
          if [ ! -s /tmp/ping.txt ]; then
            note "99-fail" "连不上 MySQL 服务容器，后面所有判定都没有意义"
            exit 1
          fi

          for pass in 1 2; do
            : > "/tmp/err-$pass.txt"
            for f in SPMS-Server/src/main/resources/db/migration/*.sql; do
              echo "::group::pass $pass — $f"
              # --force 只为"前置业务表不存在"这一类已知缺口服务：这批脚本假定业务库已存在
              # （框架表 permission/role、业务表 bom/contract… 由 Hibernate ddl-auto 生成，本仓没有它们的建表脚本）。
              # 下面把 stderr 逐条分类：允许的只有 1146，其它错误照样判失败。
              $MYSQL < "$f" >> "/tmp/err-$pass.txt" 2>&1
              echo "累计输出行数：$(wc -l < "/tmp/err-$pass.txt")"
              echo "::endgroup::"
            done
            $MYSQL -N -B -e "SELECT CONCAT(TABLE_NAME,'.',COLUMN_NAME) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() ORDER BY 1" > "/tmp/after-$pass.txt" 2>> "/tmp/err-$pass.txt"
          done

          cat /tmp/err-1.txt /tmp/err-2.txt > /tmp/err-all.txt
          total=$(wc -l < /tmp/err-all.txt)
          # 只把 "ERROR ..." 行算成错误：客户端每次调用都往 stderr 写一条
          # "Using a password on the command line" 警告，按行数判会把噪音读成失败。
          errs=$(grep -cE "^ERROR [0-9]+" /tmp/err-all.txt)
          missing=$(grep -cE "^ERROR 1146 .*doesn't exist" /tmp/err-all.txt)
          other=$((errs - missing))
          c1=$(wc -l < /tmp/after-1.txt)
          c2=$(wc -l < /tmp/after-2.txt)
          note "02-stderr" "输出 $total 行 / ERROR 行 $errs / 预期内 1146 $missing / 预期外 $other"
          note "02b-errors" "$(grep -E '^ERROR ' /tmp/err-all.txt | head -25)"
          note "03-schema" "第 1 遍后 $c1 列 / 第 2 遍后 $c2 列 / 表清单：$($MYSQL -N -B -e 'SHOW TABLES' 2>&1 | tr '\n' ' ')"
          note "03b-idempotency" "$(diff /tmp/after-1.txt /tmp/after-2.txt | head -25)"

          rc=0
          if [ "$other" -gt 0 ]; then
            echo "✗ 迁移脚本在 MySQL 8 上产生了预期外的错误："
            grep -E "^ERROR " /tmp/err-all.txt | grep -vE "^ERROR 1146 .*doesn't exist" | head -25
            rc=1
          fi
          if [ "$c1" -le 0 ]; then
            echo "✗ information_schema 里一列都没有 —— 脚本根本没执行成功，不许读成通过"
            rc=1
          fi
          if ! diff -q /tmp/after-1.txt /tmp/after-2.txt > /tmp/idem.txt 2>&1; then
            echo "✗ 重复执行后结构变化 = 不幂等（生产上意味着回滚/重放不可靠）："
            head -25 /tmp/idem.txt
            rc=1
          fi
          cp /tmp/after-2.txt /tmp/live.txt
          note "99-result" "rc=$rc（0 = 三条判据全过）"
          exit $rc

      - name: Live schema must match migration scripts and entities
        # 用真实库的 information_schema 反向核对脚本与实体：库里缺列 = 脚本其实没执行成功；
        # 库里有而脚本没有 = 有人只改了库没补迁移脚本。空 --live-columns 文件会让脚本自己判失败。
        run: |
          set -e
          node infra/scripts/check-ddl-entity-drift.mjs --live-columns /tmp/live.txt --json /tmp/ddl-drift.json

  # ==========================================================================
  # 生产编排实机门禁：真实 Docker build + Compose health + 镜像漏洞扫描。
  # 该 job 不冒充真实通知/PITR/UAT；它只证明提交物能在干净 runner 上启动并通过探针。
  # ==========================================================================
  production-smoke:
    name: Production Compose (build / health / CVE scan)
    # dev 是共享集成分支，也必须跑真实 Compose health/CVE smoke；否则 dev 只有静态门禁没有运行时证据。
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Generate isolated smoke secrets
        shell: bash
        run: |
          set -euo pipefail
          cat > .env <<EOF
          MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)
          MYSQL_DATABASE=kubo
          MYSQL_USER=kubo
          MYSQL_PASSWORD=$(openssl rand -hex 24)
          REDIS_PASSWORD=$(openssl rand -hex 24)
          JWT_SECRET=$(openssl rand -hex 32)
          DATA_PERMISSION_MODE=shadow
          WEB_PORT=18080
          # Smoke only: local unroutable sink keeps startup deterministic; no alert delivery is claimed here.
          KUBO_ALERT_WEBHOOK_URL=http://127.0.0.1:19999/webhook
          EOF
          chmod 600 .env

      - name: Validate production Compose interpolation
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build --pull

      - name: Start stack and wait for health
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.prod.yml up -d
          expected='alertmanager mysql prometheus redis server web'
          for attempt in {1..36}; do
            services=$(docker compose -f docker-compose.prod.yml ps --format '{{.Service}} {{.Health}}' | sort)
            echo "$services"
            actual=$(printf '%s\n' "$services" | awk '{print $1}' | sort | tr '\n' ' ' | sed 's/ $//')
            if [ "$actual" = "$expected" ] && ! echo "$services" | grep -Eq ' (starting|unhealthy|unknown)'; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              docker compose -f docker-compose.prod.yml ps
              docker compose -f docker-compose.prod.yml logs --tail=120
              exit 1
            fi
            sleep 10
          done
          curl --fail --retry 5 --retry-delay 2 http://127.0.0.1:18080/
          # Nginx 安全头必须在真实容器响应上存在；源码配置正确但未被加载同样属于发布故障。
          headers=$(curl --fail --retry 5 --retry-delay 2 -sSI http://127.0.0.1:18080/)
          printf '%s\n' "$headers" | grep -qi '^x-content-type-options: nosniff'
          printf '%s\n' "$headers" | grep -qi '^x-frame-options: DENY'
          printf '%s\n' "$headers" | grep -qi '^content-security-policy:'
          # Compose 的容器状态为 healthy 还不够：显式探测 Spring Actuator，避免仅靠 Nginx 首页掩盖后端启动/路由故障。
          docker compose -f docker-compose.prod.yml exec -T server wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
          # 监控组件也必须完成自身 readiness；否则业务容器健康但告警链路可能是死的。
          docker compose -f docker-compose.prod.yml exec -T prometheus wget -qO- http://127.0.0.1:9090/-/ready | grep -q 'Prometheus Server is Ready'
          docker compose -f docker-compose.prod.yml exec -T alertmanager wget -qO- http://127.0.0.1:9093/-/ready | grep -q 'Ready'

      - name: Scan built images for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: kubo-server:latest
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan frontend image for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: kubo-web:latest
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Tear down smoke stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
