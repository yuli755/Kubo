version: 2
updates:
  # ── 前端（pnpm）──────────────────────────────────────────────
  # ecosystem 仍是 npm（Dependabot 2023-09 起支持 pnpm，靠 pnpm-lock.yaml 识别锁版本）。
  - package-ecosystem: npm
    directory: / # package.json + pnpm-lock.yaml 在仓库根
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    # 只做 patch/minor 的自动升级；major 升级（可能破坏性）留给人工评估，
    # 避免「自动 PR 把 vue/element-plus 升到下一个大版本导致白屏」这类回归。
    versioning-strategy: increase

  # ── 后端（Maven）──────────────────────────────────────────────
  - package-ecosystem: maven
    directory: /SPMS-Server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: chore(deps)
    # airpower 是项目核心框架（parent POM 同时决定 Spring Boot 版本），升级需人工全量回归，
    # 不做自动 major 升级；其余传递依赖（spring-boot-*、mybatis-plus、springdoc 等）随父 POM
    # 或显式版本管理，交给 Dependabot 报 patch/minor。
    ignore:
      - dependency-name: cn.hamm:airpower
        update-types: ['version-update:semver-major']

  # ── GitHub Actions 依赖（workflow 里的 action 版本）────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 只有 5 个 action，1 个并发 PR 足够，避免分支堆积
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
