version: 2
updates:
  # ── 前端（pnpm）──────────────────────────────────────────────
  # ecosystem 仍是 npm（Dependabot 2023-09 起支持 pnpm，靠 pnpm-lock.yaml 识别锁版本）。
  - package-ecosystem: npm
    directory: / # package.json + pnpm-lock.yaml 在仓库根
    schedule:
      interval: weekly
      day: monday
    # 2026-09-28 分支收敛决策：limit=0 彻底停用该 ecosystem 的自动版本更新 PR，
    # 因为 dependabot/* 分支会每周重建，导致「只保留 main + dev」的清理不可持续。
    # 依赖升级改为人工按需执行（pnpm up / mvn versions:display-dependency-updates）。
    # 注意：Dependabot **security updates** 由 repo Settings → Security 单独控制，
    # 本文件管不到；若要彻底静默，需在设置里一并关闭。
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    # 只做 patch/minor 的自动升级；major 升级（可能破坏性）留给人工评估，
    # 避免「自动 PR 把 vue/element-plus 升到下一个大版本导致白屏」这类回归。
    versioning-strategy: increase

  # ── 后端（Maven）──────────────────────────────────────────────
  - package-ecosystem: maven
    directory: /SPMS-Server
    schedule:
      interval: weekly
      day: monday
    # 2026-09-28 同上：停用自动版本更新 PR，后端升级走人工评估
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: chore(deps)
    # airpower 是项目核心框架（parent POM 同时决定 Spring Boot 版本），升级需人工全量回归，
    # 不做自动 major 升级；其余传递依赖（spring-boot-*、mybatis-plus、springdoc 等）随父 POM
    # 或显式版本管理，交给 Dependabot 报 patch/minor。
    ignore:
      - dependency-name: cn.hamm:airpower
        update-types: ['version-update:semver-major']

  # ── GitHub Actions 依赖（workflow 里的 action 版本）────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 2026-09-28 同上：停用自动版本更新 PR，action 版本升级走人工
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
