events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend {
        server kubo-server:8080;
    }

    server {
        listen 80;
        server_name localhost;
        # S4：生产禁止目录列表。autoindex on 会把静态目录结构暴露给访问者，
        # 是攻击面测绘来源（与生产暴露 OpenAPI schema 同类），默认 off。
        autoindex off;

        location /static/ {
            alias /home/static/;
        }

        # 前端静态文件
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # ── S4：前端静态资源安全头 ─────────────────────────────────────────
            # 后端 SecurityHeadersFilter 只覆盖 /api/（JSON/WebSocket），前端 HTML/JS/CSS
            # 由 nginx 托管、不经过后端 filter，故安全头必须在 nginx 层补齐。
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            # 防点击劫持：管理后台不允许被 iframe 嵌入。后端只出 JSON，此头必须加在 HTML 层。
            add_header X-Frame-Options "DENY" always;

            # ── S4：CSP Report-Only 起步 ───────────────────────────────────────
            # 阶段 1 用 Report-Only：浏览器只上报违规（console 可见）、不阻断任何加载，零白屏风险。
            # 观察期确认无遗漏后，再移除 "-Report-Only" 强制化（见方案文档 S4 第二阶段，需 CI 回归）。
            #
            # script-src 用 sha256 精确放行 index.html 的内联防闪烁脚本，无需 'unsafe-inline'；
            # style-src 保留 'unsafe-inline'（Vue 动态 :style 绑定 + Element Plus 运行时内联样式）；
            # connect-src 放行同源 API 与 wss:// WebSocket；worker-src 放行 PWA service worker；
            # frame-src 放行 blob:（Firefox 把 <a download href=blob:> 的文件导出视为 frame 导航，
            # 不放行 blob: 会导致 Firefox 用户无法下载导出文件 —— 见审查报告第六批）。
            # ⚠️ 改 index.html 的内联 <script> 内容后必须同步更新下面的 sha256，
            #    否则强制化后会白屏 —— 本地门禁 cspContract.spec.ts 会校验 hash 与 index.html 一致。
            add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-K8ZVNOW2EtBhRS5ND36W+PRX3zj2X/wgpLuEaJsCHN8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        }

        # 反向代理API请求到后端
        location /api/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}