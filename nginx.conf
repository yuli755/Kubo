events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend {
        server kubo-server:8080;
    }

    server {
        listen 80;
        server_name localhost;
        # S4：生产禁止目录列表。autoindex on 会把静态目录结构暴露给访问者，
        # 是攻击面测绘来源（与生产暴露 OpenAPI schema 同类），默认 off。
        autoindex off;

        location /static/ {
            alias /home/static/;
            # 用户上传文件（可能含 SVG/HTML）在此托管，必须显式关 MIME 嗅探：
            # nginx 的 add_header 不跨 location 继承，/static/ 拿不到 location / 的安全头。
            add_header X-Content-Type-Options "nosniff" always;
        }

        # 前端静态文件
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # ── S4：前端静态资源安全头 ─────────────────────────────────────────
            # 后端 SecurityHeadersFilter 只覆盖 /api/（JSON/WebSocket），前端 HTML/JS/CSS
            # 由 nginx 托管、不经过后端 filter，故安全头必须在 nginx 层补齐。
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            # 防点击劫持：管理后台不允许被 iframe 嵌入。后端只出 JSON，此头必须加在 HTML 层。
            add_header X-Frame-Options "DENY" always;

            # ── S4：CSP 强制模式（已从 Report-Only 转正）──────────────────────────
            # 说明：此前用 Content-Security-Policy-Report-Only 观察（只上报不阻断），确认前端加载
            # 资源清单完整（内联脚本/样式、ECharts dataURI、wss WebSocket、PWA worker、blob 下载、
            # 字体/图片）后转正为强制 Content-Security-Policy。
            #
            # 各指令依据：
            #   script-src 'self' + sha256 —— 精确放行 index.html 内联防闪烁脚本，无需 'unsafe-inline'；
            #   style-src 保留 'unsafe-inline' —— Vue 动态 :style 绑定 + Element Plus 运行时内联样式；
            #   connect-src 'self' ws: wss: —— 同源 API + WebSocket；
            #   worker-src 'self' blob: —— PWA service worker；
            #   frame-src 'self' blob: —— Firefox 把 <a download href=blob:> 导出视为 frame 导航；
            #   object-src 'none' / base-uri 'self' / frame-ancestors 'none' / form-action 'self' —— 常规收紧。
            #
            # ⚠️ 改 index.html 的内联 <script> 内容后必须同步更新下方 sha256（门禁 cspContract.spec.ts
            #    会校验 hash 与 index.html 一致），否则 script-src 阻断防闪烁脚本 = 白屏/主题错乱。
            #
            # ── 本机验证回归清单（docker 部署后逐项点验）──
            #   1. 登录页首屏渲染（内联防闪烁脚本 hash）
            #   2. 深色模式切换（内联骨架屏 style）
            #   3. 任一 ECharts 图表页（canvas/dataURI）
            #   4. 文件导出下载（**Firefox + Chrome 各验一次**，frame-src blob）
            #   5. WebSocket 推送（connect-src wss）
            #   6. PWA 离线缓存（worker-src）
            #   7. 图片/字体加载（img-src/font-src）
            #   若任一项白屏/失效：把下方 Content-Security-Policy 改回
            #   Content-Security-Policy-Report-Only 即回滚，浏览器 console 会列出被阻断的资源。
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-K8ZVNOW2EtBhRS5ND36W+PRX3zj2X/wgpLuEaJsCHN8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; frame-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        }

        # 反向代理API请求到后端
        location /api/ {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}